  const [focusField, setFocusField] = useState('payee');

  // Focus without scrolling — autoFocus scrolls the input into view, jumping the page
  const focusNoScroll = useCallback(el => { if (el) el.focus({ preventScroll: true }); }, []);

  function startEdit(t, field = 'payee') {
    setEditingId(t.id);
    setFocusField(field);
    setEditForm({ date:parseDateForSort(t.date), payee:t.payee, cleared:t.cleared||'', debit:t.debit||'', credit:t.credit||'', account:t.account||'', category:t.category||'', notes:t.notes||'', sub:!!t.sub });
  }

  function saveEdit(id) {
    onUpdate(id, { ...editForm, debit: parseFloat(editForm.debit)||0, credit: parseFloat(editForm.credit)||0 });
    setEditingId(null);
  }

  function cancelEdit() { setEditingId(null); }

  function confirmDelete(id, payee) {
    if (window.confirm(`Delete transaction: "${payee}"?`)) onDelete(id);
  }

  const rows = maxRows ? transactions.slice(0, maxRows) : transactions;

  function SortTh({ col, children, className, style, title }) {
    if (!onSort) return <th className={className} style={style} title={title}>{children}</th>;
    const active = sortCol === col;
    const icon = active ? (sortDir === 'asc' ? '↑' : '↓') : '↕';
    return (
      <th className={['sortable', className].filter(Boolean).join(' ')} style={style} title={title} onClick={() => onSort(col)}>
        {children}<span className={`sort-icon ${active ? 'active' : 'inactive'}`}>{icon}</span>
      </th>
    );
  }

  return (
    <table className="txn-table">
      <thead>
        <tr>
          <th style={{width:32}}></th>
          <SortTh col="date">Date</SortTh>
          <SortTh col="payee">Payee</SortTh>
          <SortTh col="cleared">Cleared</SortTh>
          <SortTh col="debit" className="num">Debit</SortTh>
          <SortTh col="credit" className="num">Credit</SortTh>
          <SortTh col="account">Account</SortTh>
          <SortTh col="category">Category</SortTh>
          <SortTh col="sub" style={{width:34, textAlign:'center'}}>↻</SortTh>
          <SortTh col="matched" style={{width:34, textAlign:'center'}} title="Matched in external account">✓</SortTh>
          <SortTh col="notes">Notes</SortTh>
        </tr>
        {filters && (
          <tr>
            <td className="txn-filter-cell"></td>
            <td className="txn-filter-cell"><input style={{width:'100%',border:'1px solid #ccd6f0',borderRadius:3,padding:'2px 4px',fontSize:11}} placeholder="date…" value={filters.date||''} onChange={e=>onFilterChange('date',e.target.value)} /></td>
            <td className="txn-filter-cell"><input style={{width:'100%',border:'1px solid #ccd6f0',borderRadius:3,padding:'2px 4px',fontSize:11}} placeholder="payee…" value={filters.payee||''} onChange={e=>onFilterChange('payee',e.target.value)} /></td>
            <td className="txn-filter-cell">
              <select style={{width:'100%',border:'1px solid #ccd6f0',borderRadius:3,padding:'2px 4px',fontSize:11}} value={filters.cleared||''} onChange={e=>onFilterChange('cleared',e.target.value)}>
                <option value="">all</option>
                <option value="yes">Cleared</option>
                <option value="cc activity">CC Activity</option>
                <option value="cc pending">CC Pending</option>
                <option value="cc statement">CC Statement</option>
                <option value="__uncleared">Uncleared</option>
              </select>
            </td>
            <td className="txn-filter-cell"><input style={{width:'100%',border:'1px solid #ccd6f0',borderRadius:3,padding:'2px 4px',fontSize:11,textAlign:'right'}} placeholder="debit…" value={filters.debit||''} onChange={e=>onFilterChange('debit',e.target.value)} /></td>
            <td className="txn-filter-cell"><input style={{width:'100%',border:'1px solid #ccd6f0',borderRadius:3,padding:'2px 4px',fontSize:11,textAlign:'right'}} placeholder="credit…" value={filters.credit||''} onChange={e=>onFilterChange('credit',e.target.value)} /></td>
            <td className="txn-filter-cell"><input style={{width:'100%',border:'1px solid #ccd6f0',borderRadius:3,padding:'2px 4px',fontSize:11}} placeholder="account…" value={filters.account||''} onChange={e=>onFilterChange('account',e.target.value)} /></td>
            <td className="txn-filter-cell"><input style={{width:'100%',border:'1px solid #ccd6f0',borderRadius:3,padding:'2px 4px',fontSize:11}} placeholder="category…" value={filters.category||''} onChange={e=>onFilterChange('category',e.target.value)} /></td>
            <td className="txn-filter-cell">
              <select title="Filter subscriptions" style={{width:'100%',border:'1px solid #ccd6f0',borderRadius:3,padding:'2px 2px',fontSize:11}} value={filters.sub||''} onChange={e=>onFilterChange('sub',e.target.value)}>
                <option value="">all</option>
                <option value="yes">↻ subs</option>
                <option value="no">not subs</option>
              </select>
            </td>
            <td className="txn-filter-cell"></td>
            <td className="txn-filter-cell"><input style={{width:'100%',border:'1px solid #ccd6f0',borderRadius:3,padding:'2px 4px',fontSize:11}} placeholder="notes…" value={filters.notes||''} onChange={e=>onFilterChange('notes',e.target.value)} /></td>
          </tr>
        )}
      </thead>
      <tbody>
        {rows.map(t => {
          if (editingId === t.id) {
            const kd = e => { if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); } if (e.key === 'Enter') saveEdit(t.id); };
            return (
              <tr key={t.id} className="row-editing">
                <td>
                  <div className="txn-actions">
                    <button className="btn-save" title="Save changes (Enter)" onClick={()=>saveEdit(t.id)}>✓</button>
                    <button className="btn-cancel" title="Cancel edit (Escape)" onClick={cancelEdit}>✕</button>
                  </div>
                </td>
                <td><input className="edit-input" style={{width:100}} type="date" value={editForm.date} ref={focusField === 'date' ? focusNoScroll : undefined} onKeyDown={kd} onChange={e=>setEditForm({...editForm,date:e.target.value})} /></td>
                <td><input className="edit-input" style={{minWidth:140}} type="text" value={editForm.payee} ref={focusField === 'payee' ? focusNoScroll : undefined} onKeyDown={kd} onChange={e=>setEditForm({...editForm,payee:e.target.value})}
                  autoComplete="off" autoCorrect="off" autoCapitalize="none" spellCheck={false} /></td>
                <td>
                  <select className="edit-input" style={{width:120}} value={editForm.cleared} ref={focusField === 'cleared' ? focusNoScroll : undefined} onKeyDown={kd} onChange={e=>setEditForm({...editForm,cleared:e.target.value})}>
                    {CLEARED_OPTIONS.map(o => <option key={o} value={o}>{o || '— uncleared'}</option>)}
                  </select>
                </td>
                <td><input className="edit-input" style={{width:80}} type="number" value={editForm.debit} ref={focusField === 'debit' ? focusNoScroll : undefined} onKeyDown={kd} onChange={e=>setEditForm({...editForm,debit:e.target.value})} /></td>
                <td><input className="edit-input" style={{width:80}} type="number" value={editForm.credit} ref={focusField === 'credit' ? focusNoScroll : undefined} onKeyDown={kd} onChange={e=>setEditForm({...editForm,credit:e.target.value})} /></td>
                <td>
                  <select className="edit-input" style={{width:90}} value={editForm.account} ref={focusField === 'account' ? focusNoScroll : undefined} onKeyDown={kd} onChange={e=>setEditForm({...editForm,account:e.target.value})}>
                    <option value="">—</option>
                    {accounts.filter(a => a.shortName).map(a => <option key={a.id} value={a.shortName}>{a.shortName}</option>)}
                  </select>
                </td>
                <td><input className="edit-input" style={{width:100}} type="text" value={editForm.category} ref={focusField === 'category' ? focusNoScroll : undefined} onKeyDown={kd} onChange={e=>setEditForm({...editForm,category:e.target.value})} /></td>
                <td style={{textAlign:'center'}}><input type="checkbox" checked={!!editForm.sub} ref={focusField === 'sub' ? focusNoScroll : undefined} onKeyDown={kd} onChange={e=>setEditForm({...editForm,sub:e.target.checked})} title="Subscription payment" /></td>
                <td style={{textAlign:'center'}} onClick={e => e.stopPropagation()}>
                  <input type="checkbox" checked={!!t.matched} onChange={e => onUpdate(t.id, { matched: e.target.checked })} title="Matched in external account" />
                </td>
                <td><input className="edit-input" style={{minWidth:100}} type="text" value={editForm.notes} ref={focusField === 'notes' ? focusNoScroll : undefined} onKeyDown={kd} onChange={e=>setEditForm({...editForm,notes:e.target.value})}
                  autoComplete="off" autoCorrect="off" autoCapitalize="none" spellCheck={false} /></td>
              </tr>
            );
          }
          const edit = (field) => {
            if (editingId === t.id) return; // already editing this row
            if (editingId) {
              // Auto-save the row currently being edited before switching
              onUpdate(editingId, { ...editForm, debit: parseFloat(editForm.debit)||0, credit: parseFloat(editForm.credit)||0 });
            }
            startEdit(t, field);
          };
          return (
            <tr key={t.id} className={`row-clickable${t.id === highlightId ? ' row-last-added' : ''}`}
              title={t.id === highlightId ? 'Last transaction added' : undefined}>
              <td onClick={e => e.stopPropagation()}>
                <div className="txn-actions">
                  <button className="btn-edit" onClick={()=>startEdit(t)} title="Edit">✎</button>
                  <button className="btn-delete" onClick={()=>confirmDelete(t.id, t.payee)} title="Delete">✕</button>
                </div>
              </td>
              <td onClick={() => edit('date')}>{displayDate(t.date)}</td>
              <td onClick={() => edit('payee')}>{t.payee}</td>
              <td onClick={() => edit('cleared')}><span className={CLEARED_CLASS[t.cleared]||'cleared-blank'}>{CLEARED_LABEL[t.cleared]||'—'}</span></td>
              <td className="num" onClick={() => edit('debit')}>{t.debit ? FMT_USD(t.debit) : ''}</td>
              <td className="num" onClick={() => edit('credit')}>{t.credit ? FMT_USD(t.credit) : ''}</td>
              <td onClick={() => edit('account')}>{t.account}</td>
              <td onClick={() => edit('category')}>{t.category}</td>
              <td onClick={() => edit('sub')} style={{textAlign:'center'}}>{t.sub ? <span title="Subscription payment" style={{color:'#1a5ca8', fontWeight:700}}>↻</span> : ''}</td>
              <td style={{textAlign:'center'}} onClick={e => e.stopPropagation()}>
                <input type="checkbox" checked={!!t.matched} onChange={e => onUpdate(t.id, { matched: e.target.checked })} title="Matched in external account" />
              </td>
              <td style={{color:'#888'}} onClick={() => edit('notes')}>{t.notes}</td>
            </tr>
          );
        })}
        {rows.length === 0 && (
          <tr><td colSpan={11} style={{textAlign:'center',color:'#aaa',padding:20}}>
            No transactions yet — add one above or import a CSV
          </td></tr>
        )}
      </tbody>
      {totals && (
        <tfoot>
          <tr style={{background:'#e8eef8', fontWeight:700, borderTop:'2px solid #1a3a5c'}}>
            <td></td>
            <td colSpan={3} style={{padding:'6px 10px', color:'#1a3a5c', fontSize:12}}>{totals.count.toLocaleString()} rows</td>
            <td className="num" style={{padding:'6px 10px', color:'#1a3a5c', fontSize:12}}>{FMT_USD(totals.debit)}</td>
            <td className="num" style={{padding:'6px 10px', color:'#1a3a5c', fontSize:12}}>{FMT_USD(totals.credit)}</td>
            <td colSpan={5}></td>
          </tr>
        </tfoot>
      )}
    </table>
  );
}

// ─── LEDGER SCREEN ──────────────────────────────────────────────────────────
function LedgerScreen({ data, setData, onOpenTxns }) {
  const [form, setForm] = useState(() => {
    // Default Cleared to whatever the last-added transaction used (survives reloads)
    const last = data.transactions.find(t => t.id === localStorage.getItem('pfm_last_added_txn'));
    return { date: new Date().toISOString().slice(0,10), payee:'', cleared: last?.cleared || '', debit:'', credit:'', account:'cu', category:'', notes:'', sub:false };
  });
  const [editField, setEditField] = useState(null);
  const [editVal, setEditVal] = useState('');
  const [colFilters, setColFilters] = useState({ date:'', payee:'', cleared:'', debit:'', credit:'', account:'', category:'', notes:'', sub:'' });
  const [search, setSearch] = useState('');
  const [catDateRanges, setCatDateRanges] = useState({});
  const [expandedCatFilter, setExpandedCatFilter] = useState(null);
  const [newPayeeInputs, setNewPayeeInputs] = useState({});
  const [sortCol, setSortCol] = useState('date');
  const [sortDir, setSortDir] = useState('desc');
  const [page, setPage] = useState(1);
  const [pageSize, setPageSize] = useState(50);
  const [frozen, setFrozen] = useState(() => localStorage.getItem('pfm_ledger_frozen') !== 'false');
  const [lastAddedId, setLastAddedId] = useState(() => localStorage.getItem('pfm_last_added_txn') || null);
  const lastAdded = useMemo(() => data.transactions.find(t => t.id === lastAddedId) || null, [data.transactions, lastAddedId]);
  const [lastClearedId, setLastClearedId] = useState(() => localStorage.getItem('pfm_last_cleared_txn') || null);
  const lastCleared = useMemo(() => data.transactions.find(t => t.id === lastClearedId) || null, [data.transactions, lastClearedId]);
  function toggleFrozen() { setFrozen(v => { const next = !v; localStorage.setItem('pfm_ledger_frozen', next); return next; }); }
  // Height of the frozen top section, as % of the visible screen area. Draggable via the divider; double-click resets.
  const [frozenH, setFrozenH] = useState(() => {
    const saved = parseFloat(localStorage.getItem('pfm_ledger_frozen_h'));
    return (saved >= 12 && saved <= 70) ? saved : 40;
  });
  const frozenTopRef = React.useRef(null);
  function startDragDivider(e) {
    e.preventDefault();
    // Measure against the actual visible screen area (frozenTop's flex parent),
    // not the raw device viewport — the nav bar + bottom tab bar already eat
    // into window.innerHeight, so sizing off that overstates how much room
    // the frozen section actually has and can crowd out the table.
    const container = frozenTopRef.current ? frozenTopRef.current.parentElement : null;
    const containerH = container ? container.getBoundingClientRect().height : window.innerHeight;
    const move = ev => {
      const top = frozenTopRef.current ? frozenTopRef.current.getBoundingClientRect().top : 0;
      const vh = Math.min(70, Math.max(12, (ev.clientY - top) / containerH * 100));
      setFrozenH(vh);
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      setFrozenH(v => { localStorage.setItem('pfm_ledger_frozen_h', String(Math.round(v * 10) / 10)); return v; });
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  }
  function resetDivider() { setFrozenH(40); localStorage.setItem('pfm_ledger_frozen_h', '40'); }
  const dateInputRef = React.useRef(null);
  const accounts = data.accounts;
  const checking = accounts.find(a => a.type === 'checking');
  const creditCards = accounts.filter(a => a.type === 'credit');

  function onFilterChange(field, value) { setColFilters(f => ({ ...f, [field]: value })); setPage(1); }

  function handleSort(col) {
    if (col === sortCol) { setSortDir(d => d === 'asc' ? 'desc' : 'asc'); }
    else { setSortCol(col); setSortDir(col === 'date' ? 'desc' : 'asc'); }
    setPage(1);
  }

  const txns = useMemo(() => {
    const f = colFilters;
    const q = search.toLowerCase();
    const filtered = data.transactions.filter(t => {
      if (q && !t.payee?.toLowerCase().includes(q) && !t.category?.toLowerCase().includes(q) && !t.notes?.toLowerCase().includes(q)) return false;
      if (f.date     && !displayDate(t.date).includes(f.date)) return false;
      if (f.payee    && !t.payee?.toLowerCase().includes(f.payee.toLowerCase())) return false;
      if (f.cleared === '__uncleared' && t.cleared) return false;
      if (f.cleared && f.cleared !== '__uncleared' && t.cleared !== f.cleared) return false;
      if (f.debit    && !String(t.debit||'').includes(f.debit)) return false;
      if (f.credit   && !String(t.credit||'').includes(f.credit)) return false;
      if (f.account  && !t.account?.toLowerCase().includes(f.account.toLowerCase())) return false;
      if (f.category && !t.category?.toLowerCase().includes(f.category.toLowerCase())) return false;
      if (f.sub === 'yes' && !t.sub) return false;
      if (f.sub === 'no'  &&  t.sub) return false;
      if (f.notes    && !t.notes?.toLowerCase().includes(f.notes.toLowerCase())) return false;
      return true;
    });
    return filtered.sort((a, b) => {
      if (sortCol === 'date') {
        const av = parseDateForSort(a.date), bv = parseDateForSort(b.date);
        return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      }
      if (sortCol === 'debit' || sortCol === 'credit') {
        const av = parseFloat(a[sortCol]) || 0, bv = parseFloat(b[sortCol]) || 0;
        return sortDir === 'asc' ? av - bv : bv - av;
      }
      const av = String(a[sortCol] ?? '').toLowerCase(), bv = String(b[sortCol] ?? '').toLowerCase();
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
  }, [data.transactions, colFilters, search, sortCol, sortDir]);

  const totalPages = Math.max(1, Math.ceil(txns.length / pageSize));
  const paged = txns.slice((page - 1) * pageSize, page * pageSize);
  const totalDebit = txns.reduce((s, t) => s + (t.debit || 0), 0);
  const totalCredit = txns.reduce((s, t) => s + (t.credit || 0), 0);

  // Min projected checking balance from the cashflow forecast (cell C1 on the Cashflow tab)
  const { minBal: cashflowMinBal, minPeriod: cashflowMinPeriod } = useMemo(() => {
    const count = parseInt(localStorage.getItem('pfm_period_count')) || 13;
    const f = computeCashflowForecast(data, getPeriods(count), new Date());
    return { minBal: f.minBal, minPeriod: f.minPeriod };
  }, [data]);

  const computedClearedBalance = useMemo(() => {
    if (!checking) return 0;
    const unclearedDebits  = data.transactions.filter(t => !t.cleared && t.account === checking.shortName).reduce((s,t) => s + (t.debit  || 0), 0);
    const unclearedCredits = data.transactions.filter(t => !t.cleared && t.account === checking.shortName).reduce((s,t) => s + (t.credit || 0), 0);
    return (checking.currentBalance || 0) - unclearedDebits + unclearedCredits;
  }, [data.transactions, checking]);

  // Credit card balances computed from transactions: debit = charge, credit = payment
  const ccBalances = useMemo(() => {
    const sum = (txns, cleared) => txns
      .filter(t => t.cleared === cleared)
      .reduce((s, t) => s + (t.debit || 0) - (t.credit || 0), 0);
    return Object.fromEntries(creditCards.map(cc => {
      const ccTxns = data.transactions.filter(t => t.account === cc.shortName);
      return [cc.id, {
        statement: sum(ccTxns, 'cc statement'),
        activity:  sum(ccTxns, 'cc activity'),
        pending:   sum(ccTxns, 'cc pending'),
      }];
    }));
  }, [data.transactions, creditCards]);

  const catSums = data.categorySummaries.map(cs => {
    const cat = cs.category || cs.label;
    if (!cat) return { ...cs, income: 0, expenses: 0, net: 0 };
    const { from, to } = catDateRanges[cs.id] || {};
    const pf = cs.payeeFilter;
    const matched = data.transactions.filter(t => {
      if (t.category?.toLowerCase() !== cat.toLowerCase()) return false;
      if (pf?.payees?.length > 0) {
        const pl = (t.payee || '').toLowerCase();
        const hit = pf.payees.some(p => pl.includes(p.toLowerCase()));
        if (pf.mode === 'include' && !hit) return false;
        if (pf.mode !== 'include' &&  hit) return false;
      }
      const d = parseDateForSort(t.date);
      if (from && d < from) return false;
      if (to   && d > to)   return false;
      return true;
    });
    const income   = matched.reduce((s, t) => s + (t.credit || 0), 0);
    const expenses = matched.reduce((s, t) => s + (t.debit  || 0), 0);
    return { ...cs, income, expenses, net: income - expenses };
  });

  const selectOnFocusRef = React.useRef(false);
  function startEdit(key, val) { setEditField(key); setEditVal(String(val ?? '')); selectOnFocusRef.current = true; }

  function saveAccountField(field, val) {
    const now = new Date();
    const stamp = `${now.getMonth()+1}/${now.getDate()}/${String(now.getFullYear()).slice(2)}`;
    const updated = data.accounts.map(a => a.id === checking.id
      ? { ...a, [field]: parseFloat(val) || 0, ...(field === 'currentBalance' ? { lastUpdated: stamp } : {}) }
      : a);
    setData({ ...data, accounts: updated });
    setEditField(null);
  }

  function saveAccountText(field, val) {
    const updated = data.accounts.map(a => a.id === checking.id ? { ...a, [field]: val } : a);
    setData({ ...data, accounts: updated });
    setEditField(null);
  }

  function saveCatSum(id, field, val) {
    const updated = data.categorySummaries.map(cs =>
      cs.id === id ? { ...cs, [field]: field === 'label' ? val : (parseFloat(val) || 0) } : cs
    );
    setData({ ...data, categorySummaries: updated });
    setEditField(null);
  }

  function updateCatFilter(id, patch) {
    setData({ ...data, categorySummaries: data.categorySummaries.map(cs => {
      if (cs.id !== id) return cs;
      const existing = cs.payeeFilter || { mode: 'exclude', payees: [] };
      return { ...cs, payeeFilter: { ...existing, ...patch } };
    })});
  }

  function addPayeeToFilter(id, payee) {
    const trimmed = payee.trim();
    if (!trimmed) return;
    const cs = data.categorySummaries.find(c => c.id === id);
    const existing = cs?.payeeFilter?.payees || [];
    if (!existing.some(p => p.toLowerCase() === trimmed.toLowerCase()))
      updateCatFilter(id, { payees: [...existing, trimmed] });
    setNewPayeeInputs(v => ({ ...v, [id]: '' }));
  }

  function removePayeeFromFilter(id, payee) {
    const cs = data.categorySummaries.find(c => c.id === id);
    const existing = cs?.payeeFilter?.payees || [];
    updateCatFilter(id, { payees: existing.filter(p => p !== payee) });
  }

  // ── Account management: add/remove credit cards + other accounts ────────────
  // Other accounts (vehicles, savings, loans…) are manual-balance accounts —
  // not transaction-driven like checking/credit — so each balance edit stamps
  // a "last updated" date.
  const otherAccounts = accounts.filter(a => a.type === 'asset' || a.type === 'liability');
  const cashAccounts = accounts.filter(a => a.type === 'cash');
  const [addingCard, setAddingCard] = useState(false);
  const [newCard, setNewCard] = useState({ shortName: '', promoExpiry: '' });
  const [addingOther, setAddingOther] = useState(false);
  const [newOther, setNewOther] = useState({ name: '', type: 'asset', balance: '' });
  const [addingCash, setAddingCash] = useState(false);
  const [newCash, setNewCash] = useState({ name: '', balance: '' });

  function stampNow() { const now = new Date(); return `${now.getMonth()+1}/${now.getDate()}/${String(now.getFullYear()).slice(2)}`; }

  function addCreditCard() {
    const sn = newCard.shortName.trim().toLowerCase();
    if (!sn) return;
    if (accounts.some(a => a.shortName === sn)) { window.alert(`An account with short name "${sn}" already exists.`); return; }
    const acct = { id: `cc_${Date.now()}`, name: sn, shortName: sn, type: 'credit',
      statementBalance: 0, activityBalance: 0, pendingBalance: 0,
      ...(newCard.promoExpiry ? { promoExpiry: newCard.promoExpiry } : {}) };
    setData({ ...data, accounts: [...accounts, acct] });
    setNewCard({ shortName: '', promoExpiry: '' });
    setAddingCard(false);
  }

  // Cash accounts (savings, second checking…) — spendable in the ledger:
  // they get a shortName, so they appear in the transaction account dropdown.
  function addCashAccount() {
    const sn = newCash.name.trim().toLowerCase();
    if (!sn) return;
    if (accounts.some(a => a.shortName === sn)) { window.alert(`An account with short name "${sn}" already exists.`); return; }
    const acct = { id: `cash_${Date.now()}`, name: sn, shortName: sn, type: 'cash',
      currentBalance: parseFloat(newCash.balance) || 0, lastUpdated: stampNow() };
    setData({ ...data, accounts: [...accounts, acct] });
    setNewCash({ name: '', balance: '' });
    setAddingCash(false);
  }

  function saveCashBalance(id, val) {
    setData({ ...data, accounts: accounts.map(a => a.id === id ? { ...a, currentBalance: parseFloat(val) || 0, lastUpdated: stampNow() } : a) });
    setEditField(null);
  }

  function addOtherAccount() {
    const name = newOther.name.trim();
    if (!name) return;
    const acct = { id: `oa_${Date.now()}`, name, type: newOther.type, balance: parseFloat(newOther.balance) || 0, lastUpdated: stampNow() };
    setData({ ...data, accounts: [...accounts, acct] });
    setNewOther({ name: '', type: 'asset', balance: '' });
    setAddingOther(false);
  }

  function removeAccount(id) {
    const acct = accounts.find(a => a.id === id);
    if (!acct) return;
    const txnCount = acct.shortName ? data.transactions.filter(t => t.account === acct.shortName).length : 0;
    const msg = txnCount > 0
      ? `Remove "${acct.shortName || acct.name}"? ${txnCount.toLocaleString()} ledger transaction(s) reference it — they stay in the ledger, but this summary row disappears.`
      : `Remove "${acct.shortName || acct.name}"?`;
    if (!window.confirm(msg)) return;
    setData({ ...data, accounts: accounts.filter(a => a.id !== id) });
  }

  // Rename a credit card — transactions reference cards by shortName, so a
  // rename must also remap every matching transaction to keep balances intact.
  function saveCardShortName(id, val) {
    const sn = (val || '').trim().toLowerCase();
    const acct = accounts.find(a => a.id === id);
    if (!acct || !sn || sn === acct.shortName) { setEditField(null); return; }
    if (accounts.some(a => a.id !== id && a.shortName === sn)) {
      window.alert(`An account with short name "${sn}" already exists.`);
      setEditField(null); return;
    }
    const txnCount = data.transactions.filter(t => t.account === acct.shortName).length;
    if (txnCount > 0 && !window.confirm(`Rename "${acct.shortName}" to "${sn}"?\n${txnCount.toLocaleString()} transaction(s) will be updated to the new name.`)) {
      setEditField(null); return;
    }
    setData({ ...data,
      accounts: accounts.map(a => a.id === id ? { ...a, name: sn, shortName: sn } : a),
      transactions: data.transactions.map(t => t.account === acct.shortName ? { ...t, account: sn } : t)
    });
    setEditField(null);
  }

  function saveCardPromo(id, val) {
    setData({ ...data, accounts: accounts.map(a => {
      if (a.id !== id) return a;
      const { promoExpiry, ...rest } = a;
      return val ? { ...rest, promoExpiry: val } : rest; // empty date clears the promo
    })});
    setEditField(null);
  }

  function saveCardApr(id, val) {
    const n = parseFloat(val);
    setData({ ...data, accounts: accounts.map(a => {
      if (a.id !== id) return a;
      const { apr, ...rest } = a;
      return (isNaN(n) || n <= 0) ? rest : { ...rest, apr: n }; // empty/0 clears the APR
    })});
    setEditField(null);
  }

  function saveOtherBalance(id, val) {
    setData({ ...data, accounts: accounts.map(a => a.id === id ? { ...a, balance: parseFloat(val) || 0, lastUpdated: stampNow() } : a) });
    setEditField(null);
  }

  function saveOtherName(id, val) {
    setData({ ...data, accounts: accounts.map(a => a.id === id ? { ...a, name: (val || '').trim() || a.name } : a) });
    setEditField(null);
  }

  function toggleAcctType(id) {
    setData({ ...data, accounts: accounts.map(a => a.id === id ? { ...a, type: a.type === 'asset' ? 'liability' : 'asset' } : a) });
  }

  function toggleOtherSelected(id) {
    setData({ ...data, accounts: accounts.map(a => a.id === id ? { ...a, selected: !a.selected } : a) });
  }

  function InlineNum({ editKey, value, onSave, style }) {
    if (editField === editKey) return (
      <input autoFocus className="edit-input" type="number" value={editVal}
        style={{ width:110, textAlign:'right', ...style }}
        onChange={e => setEditVal(e.target.value)}
        onFocus={e => { if (selectOnFocusRef.current) { selectOnFocusRef.current = false; e.target.select(); } }}
        onBlur={() => onSave(editVal)}
        onKeyDown={e => { if (e.key==='Enter') onSave(editVal); if (e.key==='Escape') setEditField(null); }} />
    );
    return (
      <span onClick={() => startEdit(editKey, value)}
        style={{ cursor:'pointer', borderBottom:'1px dashed #aac4e0', ...style }}
        title="Click to edit">
        {FMT_USD(value)}
      </span>
    );
  }

  function InlineText({ editKey, value, onSave, style }) {
    if (editField === editKey) return (
      <input autoFocus className="edit-input" type="text" value={editVal}
        style={{ width:100, ...style }}
        onChange={e => setEditVal(e.target.value)}
        onBlur={() => onSave(editVal)}
        onKeyDown={e => { if (e.key==='Enter') onSave(editVal); if (e.key==='Escape') setEditField(null); }} />
    );
    return (
      <span onClick={() => startEdit(editKey, value)}
        style={{ cursor:'pointer', borderBottom:'1px dashed #aac4e0', color: value ? '#1a7a1a' : '#aaa', fontStyle: value ? 'normal' : 'italic', ...style }}
        title="Click to edit">
        {value || 'untitled'}
      </span>
    );
  }

  function addTxn() {
    if (!form.payee) return;
    const txn = { id: Date.now().toString(), date: form.date, payee: form.payee, cleared: form.cleared,
      debit: form.debit ? parseFloat(form.debit) : 0, credit: form.credit ? parseFloat(form.credit) : 0,
      account: form.account, category: form.category, notes: form.notes, sub: !!form.sub };
    setData({ ...data, transactions: [...data.transactions, txn] });
    setLastAddedId(txn.id);
    localStorage.setItem('pfm_last_added_txn', txn.id);
    // Keep form.cleared as-is so the next entry defaults to the last transaction's cleared value
    setForm({ ...form, payee:'', debit:'', credit:'', category:'', notes:'', sub:false });
    requestAnimationFrame(() => { if (dateInputRef.current) { dateInputRef.current.focus(); dateInputRef.current.select(); } });
  }

  function updateTxn(id, changes) {
    // Track the most recent transaction whose Cleared status actually changed
    // value (not just re-saved with the same value), so it can be surfaced
    // next to the search field for quick reconciliation reference.
    if (Object.prototype.hasOwnProperty.call(changes, 'cleared')) {
      const prev = data.transactions.find(t => t.id === id);
      if (prev && prev.cleared !== changes.cleared) {
        setLastClearedId(id);
        localStorage.setItem('pfm_last_cleared_txn', id);
      }
    }
    setData({ ...data, transactions: data.transactions.map(t => t.id === id ? { ...t, ...changes } : t) });
  }

  function deleteTxn(id) {
    setData({ ...data, transactions: data.transactions.filter(t => t.id !== id) });
  }

  function downloadBackup() {
    const now = new Date();
    const yy = String(now.getFullYear()).slice(2);
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `full-ledger-${yy}${mm}${dd}.json`; a.click();
    URL.revokeObjectURL(url);
  }

  function truncateAll() {
    if (window.confirm(`Download a backup first? (${data.transactions.length.toLocaleString()} transactions)`)) downloadBackup();
    if (!window.confirm(`Delete all ${data.transactions.length.toLocaleString()} transactions? This cannot be undone.`)) return;
    setData({ ...data, transactions: [] });
    setPage(1);
  }

  // Net worth = checking + other assets − other liabilities − credit card balances
  const otherAssetsTotal = otherAccounts.filter(a => a.type === 'asset').reduce((s, a) => s + (a.balance || 0), 0);
  const otherLiabTotal   = otherAccounts.filter(a => a.type === 'liability').reduce((s, a) => s + (a.balance || 0), 0);
  const otherNet = otherAssetsTotal - otherLiabTotal;
  const otherSelectedAssetsTotal = otherAccounts.filter(a => a.type === 'asset' && a.selected).reduce((s, a) => s + (a.balance || 0), 0);
  const otherSelectedLiabTotal   = otherAccounts.filter(a => a.type === 'liability' && a.selected).reduce((s, a) => s + (a.balance || 0), 0);
  const otherSelectedNet = otherSelectedAssetsTotal - otherSelectedLiabTotal;
  const anyOtherSelected = otherAccounts.some(a => a.selected);
  const ccTotalAll = creditCards.reduce((s, c) => { const b = ccBalances[c.id] || {}; return s + (b.statement || 0) + (b.activity || 0) + (b.pending || 0); }, 0);
  const cashTotalAll = cashAccounts.reduce((s, a) => s + (a.currentBalance || 0), 0);
  const netWorth = (checking?.currentBalance || 0) + cashTotalAll + otherNet - ccTotalAll;

  // ── Mobile sheet editing (one bottom sheet, several kinds) ──────────────────
  const [lsheet, setLsheet] = useState(null); // { kind, id?, vals }
  function setLV(ch) { setLsheet(s => ({ ...s, vals: { ...s.vals, ...ch } })); }
  const cleanNum = v => v.replace(/[^0-9.\-]/g, '').replace(/(\..*)\./g, '$1');

  // Apply a patch to one account in a single write; optional rename remaps its transactions
  function commitAccount(id, patch, newShort) {
    const acct = accounts.find(a => a.id === id); if (!acct) return false;
    let txs = data.transactions; let p = { ...patch };
    if (newShort !== undefined) {
      const sn = (newShort || '').trim().toLowerCase();
      if (sn && sn !== acct.shortName) {
        if (accounts.some(a => a.id !== id && a.shortName === sn)) { window.alert(`An account with short name "${sn}" already exists.`); return false; }
        const n = txs.filter(t => t.account === acct.shortName).length;
        if (n > 0 && !window.confirm(`Rename "${acct.shortName}" to "${sn}"?\n${n.toLocaleString()} transaction(s) will be updated to the new name.`)) return false;
        txs = txs.map(t => t.account === acct.shortName ? { ...t, account: sn } : t);
        p = { ...p, name: sn, shortName: sn };
      }
    }
    setData({ ...data, transactions: txs, accounts: accounts.map(a => {
      if (a.id !== id) return a;
      const next = { ...a, ...p };
      Object.keys(next).forEach(k => next[k] === undefined && delete next[k]);
      return next;
    })});
    return true;
  }
  function removeFromSheet(id) {
    const before = accounts.length;
    removeAccount(id);
    setLsheet(null);
  }

  function saveLsheet() {
    const s = lsheet, v = s.vals;
    if (s.kind === 'checking') {
      commitAccount(checking.id, { currentBalance: parseFloat(v.amount) || 0, lastUpdated: stampNow() });
    } else if (s.kind === 'card') {
      const apr = parseFloat(v.apr);
      if (!commitAccount(s.id, { promoExpiry: v.promo || undefined, apr: (isNaN(apr) || apr <= 0) ? undefined : apr }, v.name)) return;
    } else if (s.kind === 'cash') {
      if (!commitAccount(s.id, { currentBalance: parseFloat(v.amount) || 0, lastUpdated: stampNow() }, v.name)) return;
    } else if (s.kind === 'other') {
      commitAccount(s.id, { name: v.name.trim() || undefined, type: v.type, balance: parseFloat(v.amount) || 0, lastUpdated: stampNow(), selected: v.selected || undefined });
    } else if (s.kind === 'tracker') {
      setData({ ...data, categorySummaries: data.categorySummaries.map(cs => cs.id === s.id
        ? { ...cs, label: v.label, splitWays: parseInt(v.splitWays) || 1, payeeFilter: { mode: v.mode, payees: v.payees } } : cs) });
      setCatDateRanges(r => ({ ...r, [s.id]: { from: v.from, to: v.to } }));
    } else if (s.kind === 'add') {
      const name = v.name.trim();
      if (!name) return;
      const sn = name.toLowerCase();
      if (v.type !== 'other' && accounts.some(a => a.shortName === sn)) { window.alert(`An account with short name "${sn}" already exists.`); return; }
      const acct = v.type === 'card'
        ? { id: `cc_${Date.now()}`, name: sn, shortName: sn, type: 'credit', statementBalance: 0, activityBalance: 0, pendingBalance: 0, ...(v.promo ? { promoExpiry: v.promo } : {}) }
        : v.type === 'cash'
          ? { id: `cash_${Date.now()}`, name: sn, shortName: sn, type: 'cash', currentBalance: parseFloat(v.amount) || 0, lastUpdated: stampNow() }
          : { id: `oa_${Date.now()}`, name, type: v.otherType, balance: parseFloat(v.amount) || 0, lastUpdated: stampNow() };
      setData({ ...data, accounts: [...accounts, acct] });
    }
    setLsheet(null);
  }

  const go = (opts) => onOpenTxns && onOpenTxns(opts);
  const ccTotals = creditCards.reduce((t, c) => { const b = ccBalances[c.id] || {}; return { s: t.s + (b.statement||0), a: t.a + (b.activity||0), p: t.p + (b.pending||0) }; }, { s:0, a:0, p:0 });
  const fmtRange = r => (r?.from || r?.to) ? `${r.from ? displayDate(r.from) : '…'} – ${r.to ? displayDate(r.to) : 'now'}` : 'All time';
  const Chev = () => <span className="lg-chev">›</span>;
  const v = lsheet?.vals;

  return (
    <div className="screen lg-screen">
      {/* Net worth hero */}
      <div className="lg-hero">
        <div className="lg-hero-label">Net worth</div>
        <div className={`lg-hero-amt ${netWorth < 0 ? 'neg' : ''}`}>{FMT_USD_SIGNED(netWorth)}</div>
        <div className="lg-hero-row">
          <span>Checking <b>{FMT_USD(checking?.currentBalance || 0)}</b></span>
          {cashAccounts.length > 0 && <span>Cash <b>{FMT_USD(cashTotalAll)}</b></span>}
          <span>Cards <b>−{FMT_USD(ccTotalAll)}</b></span>
          {otherAccounts.length > 0 && <span>Other <b>{FMT_USD_SIGNED(otherNet)}</b></span>}
        </div>
      </div>

      {/* Checking */}
      {checking && <>
        <div className="lg-sec"><span>Checking</span></div>
        <div className="lg-card">
          <div className="lg-row" onClick={() => setLsheet({ kind:'checking', vals:{ amount: String(checking.currentBalance || 0) } })}>
            <div className="lg-main">
              <div className="lg-name">{checking.name || 'Checking'}</div>
              <div className="lg-meta">Updated {WITH_YEAR(checking.lastUpdated) || '—'} · tap to update balance</div>
            </div>
            <div className="lg-amt big">{FMT_USD(checking.currentBalance || 0)}</div><Chev />
          </div>
          <div className="lg-kv"><span>Cleared balance</span><b>{FMT_USD(computedClearedBalance)}</b></div>
          <div className="lg-kv"><span>Min projected{cashflowMinPeriod ? ` (${cashflowMinPeriod.label})` : ''}</span><b className={cashflowMinBal < 0 ? 'neg' : ''}>{FMT_USD_SIGNED(cashflowMinBal)}</b></div>
          <button className="lg-link" onClick={() => go({ account: checking.shortName })}>View checking transactions <Chev /></button>
        </div>
      </>}

      {/* Trackers */}
      {catSums.length > 0 && <>
        <div className="lg-sec"><span>Trackers</span></div>
        <div className="lg-card">
          {catSums.map(cs => {
            const split = cs.splitWays || 1;
            const pf = cs.payeeFilter || { mode:'exclude', payees:[] };
            const r = catDateRanges[cs.id];
            return (
              <div key={cs.id} className="lg-row" onClick={() => setLsheet({ kind:'tracker', id: cs.id, vals: {
                  label: cs.label || '', splitWays: String(split), mode: pf.mode === 'include' ? 'include' : 'exclude',
                  payees: [...(pf.payees || [])], newPayee: '', from: r?.from || '', to: r?.to || '' } })}>
                <div className="lg-main">
                  <div className="lg-name">{cs.label || 'untitled'}</div>
                  <div className="lg-meta">
                    <span className="txs-in">+{FMT_USD(cs.income)}</span> · <span className="neg">−{FMT_USD(cs.expenses)}</span> · {fmtRange(r)}
                    {pf.payees?.length > 0 && <> · {pf.mode === 'include' ? 'only' : 'excl.'} {pf.payees.length} payee{pf.payees.length > 1 ? 's' : ''}</>}
                  </div>
                </div>
                <div className="lg-amt-col">
                  <div className={`lg-amt ${cs.net < 0 ? 'neg' : 'pos'}`}>{FMT_USD_SIGNED(cs.net)}</div>
                  {split > 1 && <div className="lg-sub">÷{split} = {FMT_USD(Math.abs(cs.net) / split)}</div>}
                </div><Chev />
              </div>
            );
          })}
        </div>
      </>}

      {/* Credit cards */}
      <div className="lg-sec"><span>Credit cards</span><button className="lg-add" onClick={() => setLsheet({ kind:'add', vals:{ type:'card', name:'', promo:'', amount:'', otherType:'asset' } })}>+ Add</button></div>
      <div className="lg-card">
        {creditCards.length === 0 && <div className="lg-empty">No credit cards yet.</div>}
        {creditCards.map(cc => {
          const b = ccBalances[cc.id] || { statement:0, activity:0, pending:0 };
          return (
            <div key={cc.id} className="lg-row" onClick={() => setLsheet({ kind:'card', id: cc.id, vals:{ name: cc.shortName, promo: cc.promoExpiry || '', apr: cc.apr != null ? String(cc.apr) : '' } })}>
              <div className="lg-main">
                <div className="lg-name">{cc.shortName}
                  {cc.promoExpiry && <span className="lg-pill promo">0% {cc.promoExpiry.slice(5,7)}/{cc.promoExpiry.slice(2,4)}</span>}
                  {cc.apr != null && <span className="lg-pill apr">{cc.apr}% apr</span>}
                </div>
                <div className="lg-meta">Stmt {FMT_USD(b.statement)} · Activity {FMT_USD(b.activity)} · Pending {FMT_USD(b.pending)}</div>
              </div>
              <div className="lg-amt">{FMT_USD(b.statement + b.activity + b.pending)}</div><Chev />
            </div>
          );
        })}
        {creditCards.length > 0 && (
          <div className="lg-total"><span>Total · stmt+activity {FMT_USD(ccTotals.s + ccTotals.a)}</span><b>{FMT_USD(ccTotalAll)}</b></div>
        )}
      </div>

      {/* Cash accounts */}
      <div className="lg-sec"><span>Cash accounts</span><button className="lg-add" onClick={() => setLsheet({ kind:'add', vals:{ type:'cash', name:'', promo:'', amount:'', otherType:'asset' } })}>+ Add</button></div>
      <div className="lg-card">
        {cashAccounts.length === 0 && <div className="lg-empty">Savings or a second checking — they show up as transaction accounts.</div>}
        {cashAccounts.map(a => {
          const tx = data.transactions.filter(t => t.account === a.shortName && !t.cleared);
          const cleared = (a.currentBalance || 0) - tx.reduce((s,t) => s + (t.debit||0), 0) + tx.reduce((s,t) => s + (t.credit||0), 0);
          return (
            <div key={a.id} className="lg-row" onClick={() => setLsheet({ kind:'cash', id: a.id, vals:{ name: a.shortName, amount: String(a.currentBalance || 0) } })}>
              <div className="lg-main">
                <div className="lg-name">{a.shortName}</div>
                <div className="lg-meta">Cleared {FMT_USD(cleared)} · updated {a.lastUpdated || '—'}</div>
              </div>
              <div className="lg-amt">{FMT_USD(a.currentBalance || 0)}</div><Chev />
            </div>
          );
        })}
      </div>

      {/* Other accounts */}
      <div className="lg-sec"><span>Other accounts</span><button className="lg-add" onClick={() => setLsheet({ kind:'add', vals:{ type:'other', name:'', promo:'', amount:'', otherType:'asset' } })}>+ Add</button></div>
      <div className="lg-card">
        {otherAccounts.length === 0 && <div className="lg-empty">Vehicles, loans, other assets & liabilities.</div>}
        {otherAccounts.map(a => (
          <div key={a.id} className="lg-row" onClick={() => setLsheet({ kind:'other', id: a.id, vals:{ name: a.name, type: a.type, amount: String(a.balance || 0), selected: !!a.selected } })}>
            <button className={`lg-toggle ${a.selected ? 'on' : ''}`} title="Include in toggled total" onClick={e => { e.stopPropagation(); toggleOtherSelected(a.id); }}>{a.selected ? '✓' : ''}</button>
            <div className="lg-main">
              <div className="lg-name">{a.name} <span className={`lg-pill ${a.type}`}>{a.type}</span></div>
              <div className="lg-meta">Updated {a.lastUpdated || '—'}</div>
            </div>
            <div className={`lg-amt ${a.type === 'liability' ? 'neg' : ''}`}>{a.type === 'liability' ? '−' : ''}{FMT_USD(a.balance || 0)}</div><Chev />
          </div>
        ))}
        {anyOtherSelected && <div className="lg-total"><span>Toggled total</span><b className={otherSelectedNet < 0 ? 'neg' : ''}>{FMT_USD_SIGNED(otherSelectedNet)}</b></div>}
        {otherAccounts.length > 0 && <div className="lg-total"><span>Net (assets − liabilities)</span><b className={otherNet < 0 ? 'neg' : ''}>{FMT_USD_SIGNED(otherNet)}</b></div>}
      </div>

      {/* Recent activity */}
      {(lastAdded || lastCleared) && <>
        <div className="lg-sec"><span>Recent</span></div>
        <div className="lg-card">
          {lastAdded && (
            <div className="lg-row" onClick={() => go({ account:'', search: lastAdded.payee || '' })}>
              <div className="lg-main"><div className="lg-meta">Last added</div><div className="lg-name">{lastAdded.payee}</div><div className="lg-meta">{displayDate(lastAdded.date)} · {lastAdded.account}</div></div>
              <div className={`lg-amt ${lastAdded.credit ? 'pos' : ''}`}>{lastAdded.credit ? '+' + FMT_USD(lastAdded.credit) : '−' + FMT_USD(lastAdded.debit || 0)}</div><Chev />
            </div>
          )}
          {lastCleared && (
            <div className="lg-row" onClick={() => go({ account:'', search: lastCleared.payee || '' })}>
              <div className="lg-main"><div className="lg-meta">Last cleared</div><div className="lg-name">{lastCleared.payee || '(no payee)'}</div><div className="lg-meta">{displayDate(lastCleared.date)} · <span className={CLEARED_CLASS[lastCleared.cleared]||'cleared-blank'}>{CLEARED_LABEL[lastCleared.cleared]||'Uncleared'}</span></div></div>
              <div className={`lg-amt ${lastCleared.credit ? 'pos' : ''}`}>{lastCleared.credit ? '+' + FMT_USD(lastCleared.credit) : '−' + FMT_USD(lastCleared.debit || 0)}</div><Chev />
            </div>
          )}
        </div>
      </>}

      {/* Data */}
      <div className="lg-sec"><span>Data</span></div>
      <div className="lg-card">
        <button className="lg-link" onClick={() => go({ account:'' })}>All transactions ({data.transactions.length.toLocaleString()}) <Chev /></button>
        <button className="lg-link" onClick={downloadBackup}>Download backup (JSON) <Chev /></button>
        <button className="lg-link danger" onClick={truncateAll}>Clear all transactions…</button>
      </div>
      <div style={{height:24}} />

      {lsheet && (
        <div className="modal-overlay" onClick={() => setLsheet(null)}>
          <div className="modal txs-sheet txe" onClick={e => e.stopPropagation()}>
            <div className="txe-grab" />
            <div className="txe-head">
              <button className="txe-x" onClick={() => setLsheet(null)}>Cancel</button>
              <div className="txe-title">{{ checking:'Checking Balance', card:'Credit Card', cash:'Cash Account', other:'Account', tracker:'Tracker', add:'Add Account' }[lsheet.kind]}</div>
              <span style={{width:56}} />
            </div>

            {lsheet.kind === 'add' && (
              <div className="txs-kind">
                {[['card','Credit card'],['cash','Cash'],['other','Other']].map(([k,l]) => <button key={k} className={v.type===k?'on':''} onClick={() => setLV({type:k})}>{l}</button>)}
              </div>
            )}

            {(lsheet.kind === 'card' || lsheet.kind === 'cash' || lsheet.kind === 'other' || lsheet.kind === 'add') && <>
              <input className="txe-payee" placeholder={lsheet.kind === 'add' && v.type === 'other' ? 'Name (e.g. truck, HELOC)' : 'Short name (e.g. amex)'} value={v.name} onChange={e => setLV({name:e.target.value})} autoFocus={lsheet.kind === 'add'} />
            </>}

            {(lsheet.kind === 'checking' || lsheet.kind === 'cash' || lsheet.kind === 'other' || (lsheet.kind === 'add' && v.type !== 'card')) && <>
              <div className="txe-label">{lsheet.kind === 'checking' ? 'Current balance' : 'Balance'}</div>
              <label className="txe-amount">
                <span className="txe-sign">$</span>
                <input type="text" inputMode="decimal" placeholder="0.00" value={v.amount} autoFocus={lsheet.kind === 'checking'}
                  style={{width: Math.max(4, (v.amount || '').length + 0.6) + 'ch'}}
                  onFocus={e => e.target.select()} onChange={e => setLV({amount: cleanNum(e.target.value)})} />
              </label>
            </>}

            {(lsheet.kind === 'other' || (lsheet.kind === 'add' && v.type === 'other')) && <>
              <div className="txe-label">Type</div>
              <div className="txs-kind">
                {['asset','liability'].map(t => {
                  const key = lsheet.kind === 'add' ? 'otherType' : 'type';
                  return <button key={t} className={v[key]===t?'on':''} onClick={() => setLV({[key]:t})}>{t === 'asset' ? 'Asset' : 'Liability'}</button>;
                })}
              </div>
              {lsheet.kind === 'other' && <label className="txs-check"><input type="checkbox" checked={v.selected} onChange={e => setLV({selected:e.target.checked})} /> Include in toggled total</label>}
            </>}

            {(lsheet.kind === 'card' || (lsheet.kind === 'add' && v.type === 'card')) && <>
              <div className="txe-label">0% promo expires</div>
              <div className="lg-inline">
                <input className="txe-input" type="date" value={v.promo} onChange={e => setLV({promo:e.target.value})} />
                {v.promo && <button className="lg-clear" onClick={() => setLV({promo:''})}>Clear</button>}
              </div>
              {lsheet.kind === 'card' && <>
                <div className="txe-label">APR %</div>
                <input className="txe-input" type="text" inputMode="decimal" placeholder="e.g. 21.99" value={v.apr} onChange={e => setLV({apr: cleanNum(e.target.value)})} />
                {(() => { const b = ccBalances[lsheet.id] || {}; return (
                  <div className="lg-breakdown">
                    <div><span>Statement</span><b>{FMT_USD(b.statement||0)}</b></div>
                    <div><span>Activity</span><b>{FMT_USD(b.activity||0)}</b></div>
                    <div><span>Pending</span><b>{FMT_USD(b.pending||0)}</b></div>
                  </div>); })()}
              </>}
            </>}

            {lsheet.kind === 'checking' && (
              <div className="lg-breakdown">
                <div><span>Cleared balance</span><b>{FMT_USD(computedClearedBalance)}</b></div>
                <div><span>Last updated</span><b>{WITH_YEAR(checking?.lastUpdated) || '—'}</b></div>
              </div>
            )}

            {lsheet.kind === 'tracker' && <>
              <input className="txe-payee" placeholder="Label" value={v.label} onChange={e => setLV({label:e.target.value})} />
              <div className="txe-label">Date range</div>
              <div className="lg-inline">
                <input className="txe-input" type="date" value={v.from} onChange={e => setLV({from:e.target.value})} />
                <span style={{color:'#aab'}}>–</span>
                <input className="txe-input" type="date" value={v.to} onChange={e => setLV({to:e.target.value})} />
              </div>
              {(v.from || v.to) && <button className="txe-more" style={{marginTop:8}} onClick={() => setLV({from:'', to:''})}>Clear dates (all time)</button>}
              <div className="txe-label">Payee filter</div>
              <div className="txs-kind">
                <button className={v.mode==='exclude'?'on':''} onClick={() => setLV({mode:'exclude'})}>Exclude</button>
                <button className={v.mode==='include'?'on':''} onClick={() => setLV({mode:'include'})}>Include only</button>
              </div>
              <div className="txs-chips txe-chips">
                {v.payees.map(p => <button key={p} className="txs-chip on" onClick={() => setLV({payees: v.payees.filter(x => x !== p)})}>{p} ×</button>)}
                {v.payees.length === 0 && <span className="lg-meta">No payees — filter inactive</span>}
              </div>
              <div className="lg-inline">
                <input className="txe-input" placeholder="Add payee (partial match ok)" value={v.newPayee} onChange={e => setLV({newPayee:e.target.value})}
                  onKeyDown={e => { if (e.key === 'Enter') { const t = v.newPayee.trim(); if (t && !v.payees.some(p => p.toLowerCase() === t.toLowerCase())) setLV({payees:[...v.payees, t], newPayee:''}); } }} />
                <button className="lg-clear" onClick={() => { const t = v.newPayee.trim(); if (t && !v.payees.some(p => p.toLowerCase() === t.toLowerCase())) setLV({payees:[...v.payees, t], newPayee:''}); }}>Add</button>
              </div>
              <div className="txe-label">Split the total</div>
              <div className="txs-chips txe-chips">
                {[1,2,3,4,5,6].map(n => <button key={n} className={`txs-chip ${String(n)===String(v.splitWays)?'on':''}`} onClick={() => setLV({splitWays:String(n)})}>{n === 1 ? 'Off' : `${n} ways`}</button>)}
              </div>
            </>}

            <button className="txe-save" disabled={(lsheet.kind === 'add' || lsheet.kind === 'card' || lsheet.kind === 'cash') && !String(v.name || '').trim()} onClick={saveLsheet}>
              {lsheet.kind === 'add' ? 'Add Account' : 'Save'}
            </button>
            {(lsheet.kind === 'card' || lsheet.kind === 'cash') && (
              <button className="txe-more" style={{margin:'12px auto 0', display:'block'}} onClick={() => { const a = accounts.find(x => x.id === lsheet.id); setLsheet(null); go({ account: a?.shortName || '' }); }}>View transactions ›</button>
            )}
            {(lsheet.kind === 'card' || lsheet.kind === 'cash' || lsheet.kind === 'other') && (
              <button className="txe-delete" onClick={() => removeFromSheet(lsheet.id)}>Remove account</button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}



// ─── IMPORT / EXPORT ────────────────────────────────────────────────────────
function importCSV(text, data, setData) {
  const lines = text.trim().split('\n');
  const header = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,'').toLowerCase());
  const txns = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g,''));
    if (cols.length < 4) continue;
    const obj = {};
    header.forEach((h, idx) => { obj[h] = cols[idx] || ''; });
    // Support simpleledger format: date, payee, cleared, debit, credit, account, category, notes
    txns.push({
      id: `csv_${i}_${Date.now()}`,
      date: obj.date || obj.net || '',
      payee: obj.payee || '',
      cleared: obj.cleared || '',
      debit: parseFloat(obj.debit) || 0,
      credit: parseFloat(obj.credit) || 0,
      account: obj.account || '',
      category: obj.category || '',
      notes: obj.notes || ''
    });
  }
  const newData = { ...data, transactions: [...data.transactions, ...txns] };
  setData(newData);
  return txns.length;
}

// ─── TRANSACTIONS (mobile-first list) ───────────────────────────────────────
// Phone-friendly view of every transaction: search, account/status chips,
// grouped by date, tap a row to edit in a bottom sheet, + button to add.
// Uses the same transaction shape and localStorage keys as the Ledger screen.
function TransactionsScreen({ data, setData }) {
  const acctShorts = useMemo(() => data.accounts.filter(a => a.shortName).map(a => a.shortName), [data.accounts]);
  const [search, setSearch] = useState(() => { const s0 = localStorage.getItem('pfm_txn_search_once') || ''; localStorage.removeItem('pfm_txn_search_once'); return s0; });
  const [acctFilter, setAcctFilter] = useState(() => localStorage.getItem('pfm_txn_acct') || '');
  const [statusFilter, setStatusFilter] = useState(() => localStorage.getItem('pfm_txn_status') || '');
  const [limit, setLimit] = useState(100);
  const [sheet, setSheet] = useState(null); // null | { mode:'add'|'edit', id?, form }

  function pickAcct(v) { setAcctFilter(v); localStorage.setItem('pfm_txn_acct', v); setLimit(100); }
  function pickStatus(v) { setStatusFilter(v); localStorage.setItem('pfm_txn_status', v); setLimit(100); }

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return data.transactions.filter(t => {
      if (acctFilter && t.account !== acctFilter) return false;
      if (statusFilter === '__uncleared' && t.cleared) return false;
      if (statusFilter && statusFilter !== '__uncleared' && t.cleared !== statusFilter) return false;
      if (q) {
        const hay = `${t.payee||''} ${t.category||''} ${t.notes||''} ${t.debit||''} ${t.credit||''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }).sort((a, b) => {
      const c = parseDateForSort(b.date).localeCompare(parseDateForSort(a.date));
      return c !== 0 ? c : String(b.id).localeCompare(String(a.id));
    });
  }, [data.transactions, search, acctFilter, statusFilter]);

  const totals = useMemo(() => filtered.reduce((s, t) => ({ out: s.out + (t.debit || 0), inn: s.inn + (t.credit || 0) }), { out:0, inn:0 }), [filtered]);

  const groups = useMemo(() => {
    const out = [];
    filtered.slice(0, limit).forEach(t => {
      const key = parseDateForSort(t.date);
      const last = out[out.length - 1];
      if (last && last.key === key) last.items.push(t); else out.push({ key, items:[t] });
    });
    return out;
  }, [filtered, limit]);

  const categories = useMemo(() => {
    const set = new Set();
    data.transactions.forEach(t => { if (t.category) set.add(t.category); });
    return [...set].sort((a, b) => a.localeCompare(b));
  }, [data.transactions]);

  function dayLabel(iso) {
    if (!iso || iso.length < 10) return iso || 'No date';
    const today = new Date(); today.setHours(0,0,0,0);
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    const diff = Math.round((today - dt) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return dt.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year: y === today.getFullYear() ? undefined : 'numeric' });
  }

  function openAdd() {
    setShowMore(false);
    const last = data.transactions.find(t => t.id === localStorage.getItem('pfm_last_added_txn'));
    setSheet({ mode:'add', form: {
      date: new Date().toLocaleDateString('en-CA'), payee:'', kind:'debit', amount:'',
      account: acctFilter || last?.account || acctShorts[0] || '', cleared: last?.cleared || '',
      category:'', notes:'', sub:false } });
  }
  function openEdit(t) {
    setShowMore(false);
    const isCredit = (t.credit || 0) > 0 && !(t.debit || 0);
    setSheet({ mode:'edit', id: t.id, form: {
      date: parseDateForSort(t.date), payee: t.payee || '', kind: isCredit ? 'credit' : 'debit',
      amount: String(isCredit ? t.credit : (t.debit || '')), account: t.account || '', cleared: t.cleared || '',
      category: t.category || '', notes: t.notes || '', sub: !!t.sub } });
  }
  function setF(changes) { setSheet(s => ({ ...s, form: { ...s.form, ...changes } })); }
  const [payeeFocus, setPayeeFocus] = useState(false);
  const [showMore, setShowMore] = useState(false);
  const [toast, setToast] = useState('');
  const toastTimer = useRef(null);
  function flash(msg) { setToast(msg); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(''), 2200); }
  // Payees ranked by most recent use, each with its latest transaction (for autofill)
  const payeeIndex = useMemo(() => {
    const m = new Map();
    data.transactions.forEach(t => {
      if (!t.payee) return;
      const key = t.payee.trim().toLowerCase();
      const d = parseDateForSort(t.date);
      const cur = m.get(key);
      if (!cur || d > cur.d || (d === cur.d && String(t.id) > String(cur.t.id))) m.set(key, { key, d, t });
    });
    return [...m.values()].sort((a, b) => b.d.localeCompare(a.d));
  }, [data.transactions]);
  // Most recently used categories, for one-tap chips
  const recentCats = useMemo(() => {
    const seen = new Set(), out = [];
    for (const p of [...data.transactions].sort((a, b) => parseDateForSort(b.date).localeCompare(parseDateForSort(a.date)))) {
      if (p.category && !seen.has(p.category)) { seen.add(p.category); out.push(p.category); if (out.length >= 8) break; }
    }
    return out;
  }, [data.transactions]);
  // Picking a known payee fills in its usual category, account and type
  function pickPayee(p) {
    const t = p.t;
    const isCredit = (t.credit || 0) > 0 && !(t.debit || 0);
    setF({ payee: t.payee, category: t.category || sheet.form.category, account: t.account || sheet.form.account, kind: isCredit ? 'credit' : 'debit' });
    setPayeeFocus(false);
  }

  function saveSheet() {
    const f = sheet.form;
    if (!f.payee.trim() || (sheet.mode === 'add' && !(parseFloat(f.amount) > 0))) return;
    const amt = parseFloat(f.amount) || 0;
    const fields = { date: f.date, payee: f.payee.trim(), cleared: f.cleared,
      debit: f.kind === 'debit' ? amt : 0, credit: f.kind === 'credit' ? amt : 0,
      account: f.account, category: f.category.trim(), notes: f.notes, sub: !!f.sub };
    if (sheet.mode === 'add') {
      const txn = { id: Date.now().toString(), ...fields };
      setData({ ...data, transactions: [...data.transactions, txn] });
      localStorage.setItem('pfm_last_added_txn', txn.id);
      flash(`Added ${txn.payee} ${txn.credit ? '+' : '−'}${FMT_USD(txn.credit || txn.debit)}`);
    } else {
      const prev = data.transactions.find(t => t.id === sheet.id);
      // Same "last cleared" tracking the Ledger screen uses
      if (prev && prev.cleared !== fields.cleared) localStorage.setItem('pfm_last_cleared_txn', sheet.id);
      // Keep the original date string if the user didn't change the date
      if (prev && parseDateForSort(prev.date) === fields.date) fields.date = prev.date;
      setData({ ...data, transactions: data.transactions.map(t => t.id === sheet.id ? { ...t, ...fields } : t) });
    }
    setSheet(null);
  }
  function deleteSheet() {
    if (!window.confirm('Delete this transaction?')) return;
    setData({ ...data, transactions: data.transactions.filter(t => t.id !== sheet.id) });
    setSheet(null);
  }
  // Tap the circle to toggle cleared without opening the editor.
  // Checking → 'yes'; credit cards → 'cc pending' (matches the CC workflow).
  function quickClear(e, t) {
    e.stopPropagation();
    const isCC = data.accounts.find(a => a.shortName === t.account)?.type === 'credit';
    const next = t.cleared ? '' : (isCC ? 'cc pending' : 'yes');
    localStorage.setItem('pfm_last_cleared_txn', t.id);
    setData({ ...data, transactions: data.transactions.map(x => x.id === t.id ? { ...x, cleared: next } : x) });
  }

  const STATUS_CHIPS = [['', 'All'], ['__uncleared', 'Uncleared'], ['yes', 'Cleared'], ['cc pending', 'CC Pending'], ['cc activity', 'CC Activity'], ['cc statement', 'CC Statement']];
  const f = sheet?.form;

  return (
    <div className="screen txs-screen">
      <div className="txs-top">
        <input className="txs-search" type="search" placeholder="Search payee, category, notes, amount" value={search} onChange={e => { setSearch(e.target.value); setLimit(100); }} />
        <div className="txs-chips">
          <button className={`txs-chip ${acctFilter===''?'on':''}`} onClick={() => pickAcct('')}>All accounts</button>
          {acctShorts.map(s => <button key={s} className={`txs-chip ${acctFilter===s?'on':''}`} onClick={() => pickAcct(s)}>{s}</button>)}
        </div>
        <div className="txs-chips">
          {STATUS_CHIPS.map(([v, l]) => <button key={v||'all'} className={`txs-chip ${statusFilter===v?'on':''}`} onClick={() => pickStatus(v)}>{l}</button>)}
        </div>
        <div className="txs-summary">
          <span>{filtered.length.toLocaleString()} transactions</span>
          <span><span className="txs-out">−{FMT_USD(totals.out)}</span> · <span className="txs-in">+{FMT_USD(totals.inn)}</span></span>
        </div>
      </div>

      {groups.length === 0 && <div className="txs-empty">No transactions match.</div>}
      {groups.map(g => (
        <div key={g.key} className="txs-group">
          <div className="txs-day">{dayLabel(g.key)}</div>
          <div className="txs-list">
            {g.items.map(t => {
              const isCredit = (t.credit || 0) > 0 && !(t.debit || 0);
              const amt = isCredit ? t.credit : (t.debit || 0);
              return (
                <div key={t.id} className="txs-row" onClick={() => openEdit(t)}>
                  <button className={`txs-dot ${t.cleared ? 'on' : ''}`} title={t.cleared ? 'Mark uncleared' : 'Mark cleared'} onClick={e => quickClear(e, t)}>{t.cleared ? '✓' : ''}</button>
                  <div className="txs-main">
                    <div className="txs-payee">{t.payee || '(no payee)'}</div>
                    <div className="txs-meta">
                      {[t.category, t.account].filter(Boolean).join(' · ')}
                      {' '}<span className={CLEARED_CLASS[t.cleared] || 'cleared-blank'}>{t.cleared ? CLEARED_LABEL[t.cleared] || t.cleared : 'Uncleared'}</span>
                    </div>
                  </div>
                  <div className={`txs-amt ${isCredit ? 'txs-in' : ''}`}>{isCredit ? '+' : '−'}{FMT_USD(amt)}</div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
      {filtered.length > limit && (
        <button className="txs-more" onClick={() => setLimit(l => l + 100)}>Show more ({(filtered.length - limit).toLocaleString()} left)</button>
      )}
      <div style={{height:80}} />

      <button className="txs-fab" title="Add transaction" onClick={openAdd}>+</button>

      {sheet && (() => {
        const acctType = data.accounts.find(a => a.shortName === f.account)?.type;
        const clearedOpts = acctType === 'credit' ? ['', 'cc pending', 'cc activity', 'cc statement'] : ['', 'yes'];
        if (f.cleared && !clearedOpts.includes(f.cleared)) clearedOpts.push(f.cleared);
        const todayIso = new Date().toLocaleDateString('en-CA');
        const yd = new Date(); yd.setDate(yd.getDate() - 1); const yIso = yd.toLocaleDateString('en-CA');
        const q = f.payee.trim().toLowerCase();
        const suggestions = payeeFocus ? payeeIndex.filter(p => p.key !== q && (!q || p.key.includes(q))).slice(0, 5) : [];
        const amtNum = parseFloat(f.amount) || 0;
        const canSave = f.payee.trim() && (amtNum > 0 || sheet.mode === 'edit');
        return (
        <div className="modal-overlay" onClick={() => setSheet(null)}>
          <div className="modal txs-sheet txe" onClick={e => e.stopPropagation()}>
            <div className="txe-grab" />
            <div className="txe-head">
              <button className="txe-x" onClick={() => setSheet(null)}>Cancel</button>
              <div className="txe-title">{sheet.mode === 'add' ? 'New Transaction' : 'Edit Transaction'}</div>
              <span style={{width:56}} />
            </div>

            <div className="txs-kind">
              <button className={f.kind==='debit'?'on':''} onClick={() => setF({kind:'debit'})}>Expense</button>
              <button className={f.kind==='credit'?'on in':''} onClick={() => setF({kind:'credit'})}>Income / Payment</button>
            </div>

            <label className={`txe-amount ${f.kind==='credit'?'in':''}`}>
              <span className="txe-sign">{f.kind==='credit' ? '+' : '−'}$</span>
              <input type="text" inputMode="decimal" placeholder="0.00" value={f.amount} autoFocus={sheet.mode==='add'} style={{width: Math.max(4, (f.amount || '').length + 0.6) + 'ch'}}
                onChange={e => setF({amount: e.target.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1')})} />
            </label>

            <div className="txe-field">
              <input className="txe-payee" placeholder="Payee" value={f.payee}
                onFocus={() => setPayeeFocus(true)} onBlur={() => setTimeout(() => setPayeeFocus(false), 150)}
                onChange={e => setF({payee:e.target.value})} />
              {suggestions.length > 0 && (
                <div className="txe-sugg">
                  {suggestions.map(p => (
                    <button key={p.key} onMouseDown={e => e.preventDefault()} onClick={() => pickPayee(p)}>
                      <span className="txe-sugg-name">{p.t.payee}</span>
                      <span className="txe-sugg-meta">{[p.t.category, p.t.account].filter(Boolean).join(' · ')} · {FMT_USD((p.t.debit||0) || (p.t.credit||0))}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>

            <div className="txe-label">Category</div>
            <input className="txe-input" list="txs-cats" placeholder="Category" value={f.category} onChange={e => setF({category:e.target.value})} />
            <datalist id="txs-cats">{categories.map(c => <option key={c} value={c} />)}</datalist>
            {recentCats.length > 0 && (
              <div className="txs-chips txe-chips">
                {recentCats.map(c => <button key={c} className={`txs-chip ${f.category===c?'on':''}`} onClick={() => setF({category: f.category===c ? '' : c})}>{c}</button>)}
              </div>
            )}

            <div className="txe-label">Date</div>
            <div className="txs-chips txe-chips">
              <button className={`txs-chip ${f.date===todayIso?'on':''}`} onClick={() => setF({date:todayIso})}>Today</button>
              <button className={`txs-chip ${f.date===yIso?'on':''}`} onClick={() => setF({date:yIso})}>Yesterday</button>
              <label className={`txs-chip txe-datechip ${f.date!==todayIso && f.date!==yIso?'on':''}`}>
                {f.date!==todayIso && f.date!==yIso && f.date ? displayDate(f.date) : 'Pick date…'}
                <input type="date" value={f.date} onChange={e => e.target.value && setF({date:e.target.value})} />
              </label>
            </div>

            <div className="txe-label">Account</div>
            <div className="txs-chips txe-chips">
              {(f.account && !acctShorts.includes(f.account) ? [f.account, ...acctShorts] : acctShorts).map(s => (
                <button key={s} className={`txs-chip ${f.account===s?'on':''}`} onClick={() => {
                  const t = data.accounts.find(a => a.shortName === s)?.type;
                  const ok = t === 'credit' ? ['', 'cc pending', 'cc activity', 'cc statement'] : ['', 'yes'];
                  setF({account:s, cleared: ok.includes(f.cleared) ? f.cleared : ''});
                }}>{s}</button>
              ))}
            </div>

            <div className="txe-label">Status</div>
            <div className="txs-chips txe-chips">
              {clearedOpts.map(o => <button key={o||'blank'} className={`txs-chip ${f.cleared===o?'on':''}`} onClick={() => setF({cleared:o})}>{o ? CLEARED_LABEL[o] || o : 'Uncleared'}</button>)}
            </div>

            {!showMore && !f.notes && !f.sub
              ? <button className="txe-more" onClick={() => setShowMore(true)}>+ Notes & more</button>
              : <>
                  <div className="txe-label">Notes</div>
                  <input className="txe-input" placeholder="Optional" value={f.notes} onChange={e => setF({notes:e.target.value})} />
                  <label className="txs-check" style={{marginTop:10}}><input type="checkbox" checked={f.sub} onChange={e => setF({sub:e.target.checked})} /> Sub</label>
                </>}

            <button className="txe-save" disabled={!canSave} onClick={saveSheet}>
              {sheet.mode === 'add'
                ? (canSave ? `Add ${f.kind==='credit'?'+':'−'}${FMT_USD(amtNum)}` : 'Enter amount & payee')
                : 'Save Changes'}
            </button>
            {sheet.mode === 'edit' && <button className="txe-delete" onClick={deleteSheet}>Delete transaction</button>}
          </div>
        </div>
        );
      })()}
      {toast && <div className="txe-toast">{toast}</div>}
    </div>
  );
}

// ─── APP ROOT ───────────────────────────────────────────────────────────────
function App() {
  const VALID_TABS = ['cashflow', 'transactions', 'ledger', 'dashboard'];
  const [tab, setTab] = useState(() => {
    const saved = localStorage.getItem('pfm_active_tab');
    return VALID_TABS.includes(saved) ? saved : 'cashflow';
  });
  function switchTab(t) { setTab(t); localStorage.setItem('pfm_active_tab', t); }
  // Jump from the Ledger to the Transactions tab, pre-filtered
  function openTxns({ account = '', search = '' } = {}) {
    localStorage.setItem('pfm_txn_acct', account);
    localStorage.setItem('pfm_txn_status', '');
    if (search) localStorage.setItem('pfm_txn_search_once', search);
    switchTab('transactions');
  }
  const [data, setDataRaw] = useState(() => loadData());
  const [fileHandle, setFileHandle] = useState(null);
  const [fileStatus, setFileStatus] = useState('checking'); // checking | connected | none

  const fileHandleRef = React.useRef(null);
  fileHandleRef.current = fileHandle;

  // On startup: load from IDB + FSA in one pass so there's no stale-closure race between them.
  // The source with the most transactions wins; functional setDataRaw compares against live state.
  useEffect(() => {
    async function init() {
      const idbData  = await loadDataIDB();
      const idbCount = idbData?.transactions?.length || 0;

      let fsaHandle = null, fsaData = null, fsaCount = 0;
      if (FSA_SUPPORTED) {
        const h = await getFileHandle();
        if (h) {
          fsaData  = await readFsaFile(h);
          fsaCount = fsaData?.transactions?.length || 0;
          if (fsaData) fsaHandle = h;
        }
      }

      // Pick winner — most transactions
      const best = fsaCount >= idbCount && fsaData ? { data: fsaData, src: 'fsa' }
                 : idbCount > 0 && idbData        ? { data: idbData,  src: 'idb' }
                 : null;

      if (best) {
        setDataRaw(prev => {
          const winner = best.data.transactions.length >= prev.transactions.length ? best.data : prev;
          // Merge in any default categorySummaries missing from saved data
          const existingIds = new Set((winner.categorySummaries || []).map(cs => cs.id));
          const missing = DEFAULT_DATA.categorySummaries.filter(cs => !existingIds.has(cs.id));
          return missing.length > 0
            ? { ...winner, categorySummaries: [...(winner.categorySummaries || []), ...missing] }
            : winner;
        });
        // If FSA file won, sync it into IDB so it survives without the file next time
        if (best.src === 'fsa') saveData(best.data);
      }

      if (fsaHandle) {
        setFileHandle(fsaHandle);
        setFileStatus('connected');
      } else {
        setFileStatus(FSA_SUPPORTED ? 'none' : 'none');
      }
    }
    init();
  }, []);

  function setData(d) {
    setDataRaw(d);
    saveData(d);
    if (fileHandleRef.current) writeFsaFile(fileHandleRef.current, d);
  }

  // ── Net worth snapshots — one per pay period ────────────────────────────────
  // Runs on every data change (any tab): upserts the current period's snapshot
  // if the value moved. Past periods are never touched, so they freeze into a
  // permanent history the moment their period ends. Idempotent — when the
  // snapshot already matches, no write happens, so this can't loop.
  useEffect(() => {
    const current = getPeriods(1)[0];
    if (!current) return;
    const pk = periodKey(current);
    const parts = computeNetWorthParts(data);
    const hist = data.netWorthHistory || [];
    const existing = hist.find(h => h.period === pk);
    if (existing && existing.netWorth === parts.netWorth) return;
    const now = new Date();
    const rec = { period: pk, updated: `${now.getMonth()+1}/${now.getDate()}/${String(now.getFullYear()).slice(2)}`, ...parts };
    const newHist = existing ? hist.map(h => h.period === pk ? rec : h) : [...hist, rec];
    setData({ ...data, netWorthHistory: newHist });
  }, [data]);

  async function handleLinkFile() {
    if (FSA_SUPPORTED) {
      // Chrome / Edge — full read+write via File System Access API
      const h = await pickFsaFile();
      if (!h) return; // user cancelled
      const fileData = await readFsaFile(h);
      setFileHandle(h);
      setFileStatus('connected');
      if (fileData && fileData.transactions.length > data.transactions.length) {
        setDataRaw(fileData);
        saveData(fileData);
      } else {
        await writeFsaFile(h, data);
      }
    } else {
      // Firefox / Safari — read-only fallback via <input type=file>
      const result = await pickFileInput();
      if (!result) return;
      const fileData = result.json;
      if (!fileData?.transactions) { alert('That file doesn\'t look like a PFM data file.'); return; }
      if (fileData.transactions.length > 0) {
        const merge = data.transactions.length > 0 &&
          window.confirm(`Your app has ${data.transactions.length} transactions in memory and the file has ${fileData.transactions.length}.\n\nOK = load from file\nCancel = keep current`);
        if (merge || data.transactions.length === 0) {
          setDataRaw(fileData);
          saveData(fileData);
        }
      }
      setFileStatus('readonly');
      alert('Loaded ✓  Note: your browser doesn\'t support auto-save to the file. Use Export after making changes, then replace data.json with the downloaded file.');
    }
  }

  function backupNow() {
    const now = new Date();
    const yy = String(now.getFullYear()).slice(2);
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `full-ledger-${yy}${mm}${dd}.json`; a.click();
    URL.revokeObjectURL(url);
  }

  function handleImport() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.csv,.json';
    input.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const text = ev.target.result;
        if (file.name.endsWith('.json')) {
          try { setData(JSON.parse(text)); alert('Data imported.'); } catch { alert('Invalid JSON file.'); }
        } else {
