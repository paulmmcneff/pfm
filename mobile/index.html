<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Personal Finance Manager — Mobile</title>
  <!-- PWA: installable home-screen app. This is the dedicated phone build —
       a separate file/scope from the desktop index.html one level up, so it
       gets its own home-screen icon, its own service worker, and never
       fights the desktop layout's CSS. -->
  <meta name="theme-color" content="#1a3a5c" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PFM Mobile" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; background: #f5f5f5; color: #222; }

    /* NAV */
    .nav { background: #1a3a5c; display: flex; align-items: center; padding: 0 16px; height: 44px; gap: 4px; }
    .nav-title { color: #fff; font-weight: 700; font-size: 15px; margin-right: 20px; letter-spacing: 0.3px; }
    .nav-tab { color: #aac4e0; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; border: none; background: none; }
    .nav-tab:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .nav-tab.active { background: rgba(255,255,255,0.18); color: #fff; font-weight: 600; }
    .nav-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .nav-btn { color: #aac4e0; background: none; border: 1px solid #3a5a7c; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
    .nav-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* LAYOUT */
    .screen { padding: 16px; overflow: auto; height: calc(100vh - 44px); }

    /* CASHFLOW TABLE */
    .cf-wrap { }
    .cf-table { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 12px; }
    .cf-table th, .cf-table td { padding: 3px 8px; white-space: nowrap; border-bottom: 1px solid #d0d0d0; border-right: 1px solid #d0d0d0; }
    .cf-table tr > *:first-child { border-left: 1px solid #d0d0d0; }
    .cf-table thead tr:first-child > * { border-top: 1px solid #d0d0d0; }
    .cf-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .cf-table td.label { min-width: 160px; max-width: 200px; }
    .cf-table td.amt { width: 72px; text-align: right; }
    .cf-table td.due { width: 44px; text-align: center; color: #666; }

    /* ROW STYLES */
    .row-balance-top { background: #1a3a5c; color: #fff; font-weight: 700; }
    .row-balance-top td { color: #fff; background: #1a3a5c; }
    .row-period-header { background: #2d5a8e; color: #fff; text-align: center; font-weight: 600; }
    .row-period-header td { color: #fff; text-align: center; background: #2d5a8e; }
    .row-balance-mid { background: #dde8f5; font-weight: 600; }
    .row-paycheck td { color: #1a7a1a; font-weight: 700; }
    .row-income-tracked td { color: #1a5ca8; font-weight: 600; }
    .row-deduction td { color: #5a8fc2; }
    .row-subtotal { background: #eef4fb; font-weight: 700; border-top: 2px solid #1a3a5c; }
    .row-expense { background: #fff; }
    .row-expense:hover { background: #f9fbff; }
    .row-highlight-yellow { background: #fffacd; }
    .row-highlight-blue { background: #cce0ff; font-weight: 700; color: #00316e; }
    .row-highlight-pink td.label { color: #c0007a; font-weight: 600; }
    .row-goal { background: #e8f5e8; }
    .row-balance-bottom { background: #1a3a5c; color: #fff; font-weight: 700; }
    .row-balance-bottom td { color: #fff; }
    .row-section-header td { background: #f0f0f0; color: #555; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; padding: 2px 8px; }

    /* CURRENT PERIOD COLUMN — box-shadow keeps the cell's solid background opaque
       while still painting the yellow highlight (important for sticky frozen rows) */
    .col-current { box-shadow: inset 0 0 0 9999px rgba(255,220,50,0.12); }
    .row-balance-top .col-current, .row-balance-bottom .col-current { box-shadow: inset 0 0 0 9999px rgba(255,255,255,0.2); }
    /* Negative balances — red, readable on both light and dark rows */
    td.neg-bal { color: #c0392b !important; font-weight: 700; }
    .row-balance-top td.neg-bal { color: #ff9999 !important; }
    /* The lowest projected balance in the top row — jump target for C1 */
    .row-balance-top td.min-bal-cell { box-shadow: inset 0 0 0 2px #ff9999; }

    .cf-wrap { overflow: auto; max-height: calc(100vh - 160px); }

    /* Opaque backgrounds for frozen income rows */
    .row-balance-mid td { background: #dde8f5; }
    .row-paycheck td { background: #fff; }
    .row-income-tracked td { background: #fff; }
    .row-deduction td { background: #fff; }
    .row-subtotal td { background: #eef4fb; }

    /* ZERO VALUES */
    .zero { color: #bbb; }
    .paid-dash { color: #1a7a1a; font-weight: 700; }

    /* INCOME OVERRIDE — a period where the normal recurring amount was manually adjusted */
    .override-cell { background: #e3edfb; color: #1a5ca8; font-weight: 700; }

    /* CARRYOVER — unpaid bills rolled in from an expired pay period */
    .carryover-cell { background: #fdebd0; color: #b45309; font-weight: 700; }
    .carryover-banner { background: #fff7e6; border: 1px solid #f0c36d; border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: #7a5200; }
    .carryover-chip { background: #fff; border: 1px solid #f0c36d; border-radius: 4px; padding: 2px 6px; display: inline-flex; gap: 5px; align-items: center; font-weight: 600; color: #b45309; }
    .carryover-chip em { color: #999; font-style: normal; font-size: 11px; font-weight: 400; }
    .carryover-chip button { border: none; background: #f6e2b3; color: #7a5200; cursor: pointer; border-radius: 3px; font-size: 10px; padding: 1px 5px; font-weight: 600; }
    .carryover-chip button:hover { background: #eccf8e; }
    .carryover-hint { font-size: 11px; color: #a08040; font-weight: 400; }
    .carryover-restore { border: none; background: none; color: #3a6090; cursor: pointer; font-size: 11px; text-decoration: underline; padding: 0; }
    .carryover-skipped-note { font-size: 11px; color: #999; margin-bottom: 8px; }

    /* SECTION LABEL COLUMN */
    .sec-label { text-align: center; width: 16px; min-width: 16px; max-width: 16px; padding: 2px; border: 1px solid #d0d0d0; }
    .sec-label span { display: block; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; margin: 0 auto; }
    .sec-label-income  { color: #1a5ca8; background: #eef4fb; }
    .sec-label-expense { color: #888;    background: #f8f8f8; }
    .sec-label-add { display: block; margin: 4px auto 0; background: none; border: 1px solid currentColor; border-radius: 2px; cursor: pointer; font-size: 11px; width: 14px; height: 14px; line-height: 12px; text-align: center; padding: 0; color: inherit; opacity: 0.35; font-weight: 700; }
    .sec-label-add:hover { opacity: 1; background: rgba(255,255,255,0.4); }
    .sec-label-empty   { background: transparent; border-color: transparent; width: 16px; min-width: 16px; max-width: 16px; }

    /* COORDINATE OVERLAY */
    .coord-cell { background: #dce6f5; color: #5a7aaa; font-size: 10px; font-weight: 700; text-align: center; min-width: 22px; max-width: 22px; padding: 1px 3px !important; border: 1px solid #c0d0e8 !important; user-select: none; }
    .coord-header-row td { background: #dce6f5 !important; color: #5a7aaa !important; font-size: 10px; font-weight: 700; text-align: center; padding: 1px 3px; }
    .coord-btn { border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 11px; font-weight: 600; border: 1px solid #9ab0d0; background: #f0f4fc; color: #3a6090; }
    .coord-btn.active { background: #1a3a5c; color: #fff; border-color: #1a3a5c; }
    .period-select { border-radius: 4px; padding: 3px 6px; font-size: 11px; font-weight: 600; border: 1px solid #9ab0d0; background: #f0f4fc; color: #3a6090; cursor: pointer; }

    /* CASHFLOW INLINE EDIT */
    .cf-editable { cursor: pointer; }
    .cf-editable:hover { box-shadow: inset 0 0 0 9999px rgba(26,92,168,0.1); outline: 1px dashed #aac4e0; outline-offset: -1px; }
    .cf-edit-input { border: 1px solid #1a5ca8; border-radius: 3px; padding: 1px 4px; font-size: 12px; text-align: right; background: #fff; width: 100%; box-sizing: border-box; -moz-appearance: textfield; }
    .cf-edit-input::-webkit-inner-spin-button, .cf-edit-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    /* INCOME LABEL — clickable to open settings */
    .income-label { cursor: pointer; position: relative; }
    .income-label:hover { box-shadow: inset 0 0 0 9999px rgba(26,92,168,0.07); }
    .income-edit-hint { opacity: 0; font-size: 10px; color: #9ab0d0; margin-left: 5px; }
    .income-label:hover .income-edit-hint { opacity: 1; }

    /* EXPENSE LABEL — clickable to open settings */
    .expense-label { cursor: pointer; position: relative; }
    .expense-label:hover { box-shadow: inset 0 0 0 9999px rgba(26,92,168,0.07); }
    .expense-edit-hint { opacity: 0; font-size: 10px; color: #9ab0d0; margin-left: 5px; }
    .expense-label:hover .expense-edit-hint { opacity: 1; }
    .payments-left-badge { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 8px; background: #dbe7f6; color: #1a5ca8; font-size: 10px; font-weight: 700; line-height: 14px; vertical-align: 1px; white-space: nowrap; }

    /* DELETE BUTTON IN MODAL */
    .modal-btn-danger { background: #cc2200; color: #fff; margin-right: auto; }
    .modal-btn-danger:hover { background: #aa1800; }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 2000; display: flex; align-items: center; justify-content: center; }
    .modal { background: #fff; border-radius: 8px; padding: 24px; min-width: 300px; max-width: 380px; width: 100%; box-shadow: 0 8px 40px rgba(0,0,0,0.22); }
    .modal-title { font-size: 14px; font-weight: 700; color: #1a3a5c; margin-bottom: 18px; }
    .modal-field { margin-bottom: 13px; }
    .modal-field label { display: block; font-size: 11px; font-weight: 600; color: #777; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .modal-field input, .modal-field select { width: 100%; border: 1px solid #d0d0d0; border-radius: 4px; padding: 6px 8px; font-size: 13px; color: #222; box-sizing: border-box; }
    .modal-field input:focus, .modal-field select:focus { outline: none; border-color: #1a5ca8; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .modal-btn { padding: 6px 18px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
    .modal-btn-primary { background: #1a3a5c; color: #fff; }
    .modal-btn-primary:hover { background: #253f5e; }
    .modal-btn-secondary { background: #f0f0f0; color: #555; }
    .modal-btn-secondary:hover { background: #e4e4e4; }

    /* DASHBOARD */
    .dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .card { background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; padding: 16px; }
    .card-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; margin-bottom: 8px; font-weight: 600; }
    .card-value { font-size: 28px; font-weight: 700; color: #1a3a5c; }
    .card-value.positive { color: #1a7a1a; }
    .card-value.negative { color: #cc2200; }
    .card-value.warning { color: #b85c00; }
    .card-sub { font-size: 12px; color: #888; margin-top: 4px; }
    .alert-box { background: #fff3cd; border: 1px solid #f0c040; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
    .alert-box.urgent { background: #ffe0e0; border-color: #f08080; }
    .alert-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
    .alert-sub { font-size: 12px; color: #555; }
    .progress-bar { height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .progress-fill { height: 100%; border-radius: 4px; background: #1a7a1a; transition: width 0.3s; }
    .progress-fill.warning { background: #e07000; }
    .progress-fill.danger { background: #cc2200; }
    .section-title { font-size: 14px; font-weight: 700; color: #1a3a5c; margin: 16px 0 8px; border-bottom: 2px solid #1a3a5c; padding-bottom: 4px; }
    .bills-list { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; }
    .bill-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    .bill-row:last-child { border-bottom: none; }
    .bill-name { color: #333; }
    .bill-amount { font-weight: 600; color: #1a3a5c; }
    .bill-due { font-size: 11px; color: #999; }

    /* LEDGER */
    .ledger-top { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    .account-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .account-table th { background: #1a3a5c; color: #fff; padding: 6px 10px; text-align: right; font-weight: 600; }
    .account-table th:first-child { text-align: left; }
    .account-table td { padding: 5px 10px; border-bottom: 1px solid #eee; text-align: right; }
    .account-table td:first-child { text-align: left; font-weight: 600; color: #1a3a5c; }
    .account-table tr:last-child td { border-bottom: none; }
    .account-table .total-row td { font-weight: 700; background: #f0f4fa; border-top: 2px solid #1a3a5c; }

    /* ACCOUNT MANAGEMENT — add/remove cards & other accounts */
    .acct-add-btn { background: none; border: 1px solid #ccd6f0; border-radius: 3px; color: #3a6090; cursor: pointer; font-size: 13px; line-height: 1; width: 20px; height: 20px; padding: 0; font-weight: 700; }
    .acct-add-btn:hover { background: #eef4fb; }
    .acct-add-form { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
    .acct-add-form input, .acct-add-form select { border: 1px solid #ccd6f0; border-radius: 3px; padding: 3px 6px; font-size: 12px; }
    .acct-add-form input[type=text] { flex: 1; min-width: 120px; }
    .acct-add-form button { padding: 3px 10px; font-size: 12px; background: #1a3a5c; color: #fff; border: none; border-radius: 3px; cursor: pointer; }
    .acct-remove { background: none; border: none; color: #ccc; cursor: pointer; font-size: 13px; padding: 0 3px; margin-left: 5px; line-height: 1; }
    .acct-remove:hover { color: #cc2200; }
    .acct-type-badge { border: none; border-radius: 3px; padding: 1px 7px; font-size: 10px; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 0.3px; }
    .acct-type-badge.asset { background: #e2f0e2; color: #1a7a1a; }
    .acct-type-badge.liability { background: #fbe4e0; color: #cc2200; }
    .ledger-form { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; gap: 3px; }
    .form-group label { font-size: 11px; color: #666; font-weight: 600; }
    .form-group input, .form-group select { border: 1px solid #ccc; border-radius: 4px; padding: 5px 8px; font-size: 13px; width: 100%; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #1a5ca8; }
    .btn { padding: 6px 14px; border-radius: 4px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-primary { background: #1a3a5c; color: #fff; }
    .btn-primary:hover { background: #1a5ca8; }
    .btn-sm { padding: 3px 8px; font-size: 11px; }
    .txn-table { width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; }
    .txn-table th { background: #e8eef8; color: #333; padding: 7px 10px; text-align: left; font-weight: 600; border-bottom: 2px solid #1a3a5c; position: sticky; top: 0; z-index: 2; }
    .txn-filter-cell { position: sticky; top: 36px; background: #f5f7fc; z-index: 2; box-shadow: 0 2px 0 0 #1a3a5c; }
    .txn-table th.sortable { cursor: pointer; user-select: none; }
    .txn-table th.sortable:hover { background: #d0dff4; }
    .sort-icon { margin-left: 4px; font-size: 10px; }
    .sort-icon.active { color: #1a3a5c; }
    .sort-icon.inactive { color: #bbb; }
    .txn-table td { padding: 5px 10px; border-bottom: 1px solid #f0f0f0; line-height: 17px; white-space: nowrap; }
    .txn-table tr:hover td { background: #f5f8ff; }
    .txn-table tr.row-clickable:hover td { background: #edf3ff; cursor: pointer; }
    .txn-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .cleared-yes { color: #1a7a1a; font-size: 11px; }
    .cleared-cc { color: #1a5ca8; font-size: 11px; }
    .cleared-pending { color: #b85c00; font-size: 11px; }
    .cleared-statement { color: #555; font-size: 11px; }
    .cleared-blank { color: #bbb; font-size: 11px; }
    .txn-actions { display: flex; gap: 4px; }
    .btn-edit { background: none; border: 1px solid #bbb; border-radius: 3px; cursor: pointer; padding: 2px 6px; font-size: 11px; color: #555; }
    .btn-edit:hover { background: #e8f0ff; border-color: #1a5ca8; color: #1a5ca8; }
    .btn-delete { background: none; border: 1px solid #bbb; border-radius: 3px; cursor: pointer; padding: 2px 6px; font-size: 11px; color: #555; }
    .btn-delete:hover { background: #ffe8e8; border-color: #cc2200; color: #cc2200; }
    .btn-save { background: #1a3a5c; border: 1px solid #1a3a5c; border-radius: 3px; cursor: pointer; padding: 2px 6px; font-size: 11px; color: #fff; font-weight: 600; }
    .btn-save:hover { background: #1a5ca8; }
    .btn-cancel { background: none; border: 1px solid #bbb; border-radius: 3px; cursor: pointer; padding: 2px 6px; font-size: 11px; color: #555; }
    /* Pin these to a fixed line-height (not the OS/browser's default "normal"
       font metrics) so the actions cell renders the same height in every
       browser — otherwise display-mode (btn-edit/btn-delete) and edit-mode
       (btn-save/btn-cancel) rows can compute slightly different heights on
       different platforms, making transactions appear to shift when you
       click into edit mode. */
    .btn-edit, .btn-delete, .btn-save, .btn-cancel { line-height: 17px; }
    .btn-cancel:hover { background: #f0f0f0; }
    .row-editing td { background: #f0f6ff !important; padding: 0 4px; height: 27px; vertical-align: middle; }
    .row-editing td:first-child { padding: 5px 10px; }
    /* Pin the actions column so ✓/✕ stay visible when the row scrolls horizontally */
    .txn-table th:first-child { position: sticky; left: 0; z-index: 4; }
    .txn-table thead .txn-filter-cell:first-child { left: 0; z-index: 3; }
    .txn-table tbody td:first-child { position: sticky; left: 0; z-index: 1; background: #fff; }
    .txn-table tbody tr:hover td:first-child { background: #f5f8ff; }
    .txn-table tbody tr.row-clickable:hover td:first-child { background: #edf3ff; }
    .txn-table tfoot td:first-child { position: sticky; left: 0; background: #e8eef8; }
    .edit-input { border: 1px solid #1a5ca8; border-radius: 3px; padding: 0 4px; font-size: 12px; font-family: inherit; width: 100%; min-width: 60px; background: #fff; height: 21px; box-sizing: border-box; vertical-align: middle; }
    .edit-input[type=number] { text-align: right; }
    .edit-input:focus { outline: none; box-shadow: 0 0 0 2px rgba(26,92,168,0.2); }

    /* TRANSACTIONS */
    .filter-bar { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .txn-wrap { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; }
    .pagination { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid #eee; font-size: 12px; color: #666; }
    .page-btn { padding: 3px 10px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; background: #fff; font-size: 12px; }
    .page-btn:hover { background: #f0f0f0; }
    .page-btn.active { background: #1a3a5c; color: #fff; border-color: #1a3a5c; }
    .row-last-added td { background: #fdf6df !important; }
    .row-last-added td:first-child { border-left: 3px solid #d4a017; }

    /* ─── MOBILE (phone) ──────────────────────────────────────────────── */
    button, select, input { touch-action: manipulation; }
    .title-short { display: none; }
    .nav-menu-btn { display: none; }
    .tabbar { display: none; }
    .nav-tabs { display: flex; gap: 4px; }

    /* Bottom tab bar */
    .tabbar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 1500;

<script type="text/babel">
const APP_VERSION = 'm9'; // mobile app's own version counter — separate from the desktop file's v-numbers
const { useState, useEffect, useLayoutEffect, useMemo, useCallback, useRef } = React;

// ─── CONSTANTS ──────────────────────────────────────────────────────────────
const ANCHOR = new Date(2026, 4, 8); // local time (month is 0-indexed)
const PAY_DAYS = 14;
const FMT_USD = v => v == null ? '' : '$' + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
// Sign-preserving variant for balances/projections, where negative must be visible
const FMT_USD_SIGNED = v => v == null ? '' : (v < 0 ? '-' : '') + FMT_USD(v);
const FMT_DATE = d => { const [y,m,day] = d.split('-'); return `${parseInt(m)}/${parseInt(day)}/${y.slice(2)}`; };
const WITH_YEAR = s => { if (!s || s === '—') return s; const p = s.split('/'); if (p.length >= 3) return s; const yr = String(new Date().getFullYear()).slice(2); return `${s}/${yr}`; };

// ─── FILE SYSTEM ACCESS (persistent data.json read/write) ───────────────────
const IDB_NAME = 'pfm_fs', IDB_STORE = 'handles', IDB_KEY = 'dataJson';
const FSA_SUPPORTED = typeof window !== 'undefined' && !!window.showOpenFilePicker;

function idbOp(mode, fn) {
  return new Promise(resolve => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
    req.onsuccess = e => {
      try { fn(e.target.result.transaction(IDB_STORE, mode).objectStore(IDB_STORE), resolve); }
      catch { resolve(null); }
    };
    req.onerror = () => resolve(null);
  });
}
const getFileHandle = () => idbOp('readonly',  (s, res) => { const r = s.get(IDB_KEY);  r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); });

async function fsPermission(handle, rw) {
  const opts = rw ? { mode: 'readwrite' } : {};
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  return (await handle.requestPermission(opts)) === 'granted';
}
async function readFsaFile(handle) {
  try {
    if (!handle || !(await fsPermission(handle, false))) return null;
    const json = JSON.parse(await (await handle.getFile()).text());
    return json?.transactions ? json : null;
  } catch { return null; }
}
async function writeFsaFile(handle, data) {
  try {
    if (!handle || !(await fsPermission(handle, true))) return false;
    const w = await handle.createWritable();
    await w.write(JSON.stringify(data, null, 2));
    await w.close();
    return true;
  } catch { return false; }
}

// Pick a file — uses File System Access API if available (read+write),
// falls back to a plain <input type=file> (read only).
function pickFileInput() {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = e => {
      const file = e.target.files[0];
      if (!file) return resolve(null);
      const reader = new FileReader();
      reader.onload = ev => {
        try { resolve({ json: JSON.parse(ev.target.result), name: file.name }); }
        catch { alert('Could not parse that file as JSON.'); resolve(null); }
      };
      reader.readAsText(file);
    };
    // Some browsers fire oncancel, others don't — set a timeout fallback
    input.oncancel = () => resolve(null);
    input.click();
  });
}

async function pickFsaFile() {
  try {
    const [h] = await window.showOpenFilePicker({
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
    });
    await putFileHandle(h);
    return h;
  } catch (e) {
    if (e.name !== 'AbortError') console.warn('showOpenFilePicker error:', e);
    return null;
  }
}

// Normalise any date string to YYYY-MM-DD so comparisons and inputs work correctly.
// Handles: YYYY-MM-DD, M/D/YY, M/D/YYYY
function parseDateForSort(dateStr) {
  if (!dateStr) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(dateStr)) return dateStr;
  const m = dateStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) {
    const [, mo, dy, yr] = m;
    const year = yr.length === 2 ? (parseInt(yr) < 50 ? '20' + yr : '19' + yr) : yr;
    return `${year}-${mo.padStart(2,'0')}-${dy.padStart(2,'0')}`;
  }
  return dateStr;
}

// Display any stored date as M/D/YY regardless of how it was originally stored.
function displayDate(dateStr) {
  const iso = parseDateForSort(dateStr);
  if (!iso || iso.length < 10) return dateStr || '';
  return FMT_DATE(iso);
}

function getPeriodStart(n) {
  const d = new Date(ANCHOR);
  d.setDate(d.getDate() + n * PAY_DAYS);
  return d;
}

function getPeriods(count = 13) {
  const periods = [];
  // Find current period index
  const today = new Date();
  let idx = 0;
  while (true) {
    const s = getPeriodStart(idx);
    const e = new Date(s); e.setDate(e.getDate() + PAY_DAYS - 1);
    if (today <= e) break;
    idx++;
    if (idx > 100) break;
  }
  for (let i = idx; i < idx + count; i++) {
    const start = getPeriodStart(i);
    const end = new Date(start); end.setDate(end.getDate() + PAY_DAYS - 1);
    periods.push({ index: i, start, end,
      label: `${start.getMonth()+1}/${start.getDate()}/${String(start.getFullYear()).slice(2)}` });
  }
  return periods;
}

// Does a due-day expense fall in this period?
function expenseInPeriod(dueDay, period) {
  if (!dueDay) return true; // variable = every period
  const { start, end } = period;
  // Check each month that overlaps with this period
  for (let m = start.getMonth(); m <= end.getMonth() + (end.getFullYear() > start.getFullYear() ? 12 : 0); m++) {
    const yr = start.getFullYear() + (m > 11 ? 1 : 0);
    const mo = m % 12;
    const maxDay = new Date(yr, mo + 1, 0).getDate();
    const effectiveDay = Math.min(dueDay, maxDay);
    const dueDate = new Date(yr, mo, effectiveDay);
    if (dueDate >= start && dueDate <= end) return true;
  }
  return false;
}

function periodKey(period) {
  return period.start.toISOString().slice(0,10);
}

// 'YYYY-MM-DD' → 'M/D' for compact display in the due-day column
function fmtShortDate(iso) {
  if (!iso) return '';
  const [, m, d] = iso.split('-');
  return `${parseInt(m)}/${parseInt(d)}`;
}

// What to show in the due-day column for an income row
function incomeDueLabel(item) {
  if (item.frequency === 'monthly' && item.dueDay) return item.dueDay;
  if (item.frequency === 'one_time' && item.onDate) return fmtShortDate(item.onDate);
  if (item.frequency === 'every_n_weeks' && item.anchorDate) return `${item.intervalWeeks || 2}w`;
  if (item.expectedDate) return fmtShortDate(item.expectedDate); // reference only
  return '';
}

// Normalize names for ledger matching: lowercase, strip punctuation/spaces so
// "farmer's" matches "Farmers", "T-Mobile" matches "tmobile", etc.
function normName(s) {
  return (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}
function namesMatch(expenseName, payee) {
  const a = normName(expenseName), b = normName(payee);
  if (!a || !b) return false;
  return b.includes(a) || a.includes(b);
}

// Net worth from raw data: checking + assets − liabilities − credit card
// balances (cards computed from ledger transactions, same as the Ledger panel).
function computeNetWorthParts(data) {
  const accounts = data.accounts || [];
  const checking = accounts.find(a => a.type === 'checking');
  const ccShorts = new Set(accounts.filter(a => a.type === 'credit').map(a => a.shortName));
  const CC_BUCKETS = ['cc statement', 'cc activity', 'cc pending'];
  let ccTotal = 0;
  for (const t of (data.transactions || [])) {
    if (ccShorts.has(t.account) && CC_BUCKETS.includes(t.cleared)) ccTotal += (t.debit || 0) - (t.credit || 0);
  }
  // Cash accounts (savings, second checking…) count as assets
  const cashTotal   = accounts.filter(a => a.type === 'cash').reduce((s, a) => s + (a.currentBalance || 0), 0);
  const assets      = accounts.filter(a => a.type === 'asset').reduce((s, a) => s + (a.balance || 0), 0) + cashTotal;
  const liabilities = accounts.filter(a => a.type === 'liability').reduce((s, a) => s + (a.balance || 0), 0);
  const r2 = v => Math.round(v * 100) / 100;
  return {
    netWorth: r2((checking?.currentBalance || 0) + assets - liabilities - ccTotal),
    checking: r2(checking?.currentBalance || 0), ccTotal: r2(ccTotal), assets: r2(assets), liabilities: r2(liabilities),
  };
}

// ─── INDEXEDDB STORAGE (no size limit — safe for large CSV imports) ──────────
const DATA_IDB = 'pfm_data_v1', DATA_STORE = 'records', DATA_KEY = 'main';

function dataIdb(mode, fn) {
  return new Promise(resolve => {
    const req = indexedDB.open(DATA_IDB, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(DATA_STORE);
    req.onsuccess = e => {
      try { fn(e.target.result.transaction(DATA_STORE, mode).objectStore(DATA_STORE), resolve); }
      catch { resolve(null); }
    };
    req.onerror = () => resolve(null);
  });
}
const loadDataIDB  = () => dataIdb('readonly',  (s, res) => { const r = s.get(DATA_KEY);  r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); });
const saveDataIDB  = d  => dataIdb('readwrite', (s, res) => { const r = s.put(d, DATA_KEY); r.onsuccess = () => res(true);           r.onerror = () => res(false); });

function loadData() {
  // Synchronous initial load from localStorage (fast, works for small datasets).
  // Large datasets load from IDB in the App useEffect below.
  try {
    const s = localStorage.getItem('pfm_data');
    if (s) {
      const parsed = JSON.parse(s);
      if (parsed && parsed.transactions) return parsed;
    }
  } catch {}
  return DEFAULT_DATA;
}

function saveData(data) {
  saveDataIDB(data); // primary — no size limit
  try { localStorage.setItem('pfm_data', JSON.stringify(data)); } catch {} // best-effort fast-load cache
}


// ─── CASHFLOW FORECAST (shared) ─────────────────────────────────────────────
// Pure forecast computation — used by the Cashflow screen and by the Ledger
// tab (min projected checking balance). Call inside useMemo at the call site.
function computeCashflowForecast(data, periods, today) {
  const cf = data.cashflow;

  // Compute per-period values
  function getIncomeValue(item, period) {
    const key = periodKey(period);

    // Current period: if a matching credit transaction already exists in the ledger, treat as received → show $0
    const isCurrent = period.start <= today && today <= period.end;
    if (isCurrent) {
      const earlyStart = new Date(period.start); earlyStart.setDate(earlyStart.getDate() - 2);
      const pStart = earlyStart.toISOString().slice(0, 10);             // YYYY-MM-DD of 2 days before period start
      const pEnd   = period.end.toISOString().slice(0, 10);             // YYYY-MM-DD of period end
      const matchName = item.ledgerMatch || item.name;
      const received = data.transactions.some(t => {
        if (!(t.credit > 0)) return false;
        const d = parseDateForSort(t.date);
        if (d < pStart || d > pEnd) return false;
        const categoryMatch = (t.category || '').toLowerCase() === 'salary';
        return namesMatch(matchName, t.payee) && categoryMatch;
      });
      if (received) return 0;
    }

    // Manual per-period override — takes priority over the frequency formula.
    // Not for 'custom' rows, which are already fully per-period on their own.
    if (item.frequency !== 'custom' && item.periodOverrides && Object.prototype.hasOwnProperty.call(item.periodOverrides, key)) {
      return item.periodOverrides[key];
    }

    // Optional active window — empty start = begins immediately, empty end = runs indefinitely
    if (item.startDate && new Date(item.startDate + 'T00:00:00') > period.end) return 0;
    if (item.endDate && new Date(item.endDate + 'T23:59:59') < period.start) return 0;

    if (item.frequency === 'every_period') return item.amount;
    if (item.frequency === 'monthly') return expenseInPeriod(item.dueDay, period) ? item.amount : 0;
    if (item.frequency === 'custom') return item.customAmounts?.[key] || 0;
    if (item.frequency === 'one_time') {
      // Lands only in the pay period containing the date
      if (!item.onDate) return 0;
      const d = new Date(item.onDate + 'T00:00:00');
      return (d >= period.start && d <= period.end) ? item.amount : 0;
    }
    if (item.frequency === 'every_n_weeks') {
      // Recurs every N weeks from an anchor date — may hit a period 0, 1, or 2+ times
      if (!item.anchorDate) return 0;
      const step = Math.max(1, parseInt(item.intervalWeeks) || 2) * 7 * 86400000;
      let d = new Date(item.anchorDate + 'T00:00:00');
      if (d < period.start) d = new Date(d.getTime() + Math.ceil((period.start - d) / step) * step);
      const ws = item.startDate ? new Date(item.startDate + 'T00:00:00') : null;
      const we = item.endDate ? new Date(item.endDate + 'T23:59:59') : null;
      let count = 0;
      while (d <= period.end) { if ((!ws || d >= ws) && (!we || d <= we)) count++; d = new Date(d.getTime() + step); }
      return count * item.amount;
    }
    return 0;
  }

  // fuchase payoff schedule: split the remaining balance into equal payments,
  // one on each remaining monthly due date (due day comes from the promo row)
  // through the deadline, and place each payment in the pay period containing it
  const fuchaseSchedule = (() => {
    const item = cf.expenses.find(e => e.id === 'fuchase_monthly');
    if (!item || item.status === 'paid_off' || !(item.remainingBalance > 0) || periods.length === 0) return { byPeriod: {}, count: 0, perPayment: 0 };
    const promo = cf.expenses.find(e => e.id === 'fuchase_promo');
    const dueDay = promo?.dueDay || item.dueDay || 1;
    const deadline = item.deadline ? new Date(item.deadline + 'T23:59:59') : periods[periods.length - 1].end;
    const from = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const dates = [];
    let y = from.getFullYear(), m = from.getMonth() - 1;
    for (let i = 0; i < 36; i++) {
      m++; if (m > 11) { m -= 12; y++; }
      const maxDay = new Date(y, m + 1, 0).getDate();
      const d = new Date(y, m, Math.min(dueDay, maxDay));
      if (d < from) continue;
      if (d > deadline) break;
      dates.push(d);
    }
    if (dates.length === 0) dates.push(from); // past the last due date — remainder due now
    const per = Math.round((item.remainingBalance / dates.length) * 100) / 100;
    const byPeriod = {};
    dates.forEach((d, i) => {
      const amt = i === dates.length - 1
        ? Math.round((item.remainingBalance - per * (dates.length - 1)) * 100) / 100
        : per;
      const p = periods.find(p => p.start <= d && d <= p.end)
        || (d < periods[0].start ? periods[0] : periods[periods.length - 1]);
      const k = periodKey(p);
      byPeriod[k] = Math.round(((byPeriod[k] || 0) + amt) * 100) / 100;
    });
    return { byPeriod, count: dates.length, perPayment: per };
  })();

  // swchase forecast: always two upcoming entries, computed live from the ledger —
  //  1) the current statement balance, due on the next monthly due date
  //  2) cc activity + cc pending (the charges that will form the next statement),
  //     due in the pay period containing the following month's due date
  const swchaseForecast = (() => {
    const item = cf.expenses.find(e => e.id === 'swchase_payment');
    if (!item || item.status === 'paid_off' || periods.length === 0) return { byPeriod: {}, statement: 0, upcoming: 0 };
    const acct = data.accounts.find(a => a.type === 'credit' && namesMatch(item.ledgerMatch || item.name, a.shortName));
    const txns = data.transactions.filter(t => t.account === (acct?.shortName || 'swchase'));
    const sum = c => txns.filter(t => t.cleared === c).reduce((s, t) => s + (t.debit || 0) - (t.credit || 0), 0);
    const statement = Math.round(sum('cc statement') * 100) / 100;
    const upcoming  = Math.round((sum('cc activity') + sum('cc pending')) * 100) / 100;
    // First two monthly due-date occurrences from today forward
    const dueDay = item.dueDay || 1;
    const from = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const dueDates = [];
    let y = from.getFullYear(), m = from.getMonth() - 1;
    while (dueDates.length < 2) {
      m++; if (m > 11) { m -= 12; y++; }
      const maxDay = new Date(y, m + 1, 0).getDate();
      const d = new Date(y, m, Math.min(dueDay, maxDay));
      if (d < from) continue;
      dueDates.push(d);
    }
    const byPeriod = {};
    const place = (d, amt) => {
      const p = periods.find(p => p.start <= d && d <= p.end) || (d < periods[0].start ? periods[0] : null);
      if (p) { const k = periodKey(p); byPeriod[k] = Math.round(((byPeriod[k] || 0) + amt) * 100) / 100; }
    };
    place(dueDates[0], statement);
    place(dueDates[1], upcoming);
    return { byPeriod, statement, upcoming };
  })();

  // Current period: if a matching debit transaction already exists in the ledger,
  // the expense has been paid → remove it from the current period's forecast
  function expensePaidThisPeriod(item, period) {
    const isCurrent = period.start <= today && today <= period.end;
    if (!isCurrent) return false;
    const pStart = period.start.toISOString().slice(0, 10);
    const pEnd   = period.end.toISOString().slice(0, 10);
    const matchName = item.ledgerMatch || item.name;
    return data.transactions.some(t => {
      if (!(t.debit > 0)) return false;
      const d = parseDateForSort(t.date);
      if (d < pStart || d > pEnd) return false;
      // Fixed bills also match on category (e.g. payee "las casitas", category
      // "hoa"). Variable budgets stay payee-only — otherwise one categorized
      // charge would zero out the whole period's budget.
      return namesMatch(matchName, t.payee) || (!!item.dueDay && namesMatch(matchName, t.category));
    });
  }

  // ── Carryover reconciliation ──────────────────────────────────────────────
  // Stateless "close the books" check: look back at recently-ended pay periods
  // and find fixed bills that were due but never matched to a ledger debit.
  // Payments are assigned to due instances oldest-first, so a late payment
  // logged in the current period clears the *carryover* before it clears the
  // current period's own instance of the same bill.
  const CARRYOVER_LOOKBACK = 3; // how many expired periods to scan
  const carryRecon = (() => {
    const empty = { byExpense: {}, entries: [], skippedEntries: [], absorbedEntries: [] };
    const current = periods[0];
    if (!current) return empty;
    const expired = [];
    for (let k = Math.max(0, current.index - CARRYOVER_LOOKBACK); k < current.index; k++) {
      const start = getPeriodStart(k);
      const end = new Date(start); end.setDate(end.getDate() + PAY_DAYS - 1);
      expired.push({ start, end, label: `${start.getMonth()+1}/${start.getDate()}/${String(start.getFullYear()).slice(2)}` });
    }
    if (expired.length === 0) return empty;
    const skipped = cf.skippedCarryovers || [];
    const winStart = expired[0].start.toISOString().slice(0, 10);
    const winEnd = current.end.toISOString().slice(0, 10);
    const byExpense = {}, entries = [], skippedEntries = [], absorbedEntries = [];
    for (const item of cf.expenses) {
      // Only fixed bills with a real due day and amount are "owed" — variable
      // budgets reset each period, and the fuchase/swchase payoff schedules
      // already self-heal by recomputing from today's remaining balance.
      if (!item.dueDay || !(item.amount > 0)) continue;
      if (item.status === 'paid_off') continue;
      if (['fuchase_monthly', 'fuchase_promo', 'swchase_payment'].includes(item.id)) continue;
      // Chronological list of due instances inside the window
      const instances = [];
      for (const p of expired) if (expenseInPeriod(item.dueDay, p)) instances.push({ period: p, expired: true });
      const dueNow = expenseInPeriod(item.dueDay, current);
      if (dueNow) instances.push({ period: current, expired: false });
      if (instances.length === 0) continue;
      // Count matching ledger debits across the whole window
      const matchName = item.ledgerMatch || item.name;
      let payCount = 0;
      for (const t of data.transactions) {
        if (!(t.debit > 0)) continue;
        const d = parseDateForSort(t.date);
        if (d < winStart || d > winEnd) continue;
        if (namesMatch(matchName, t.payee) || namesMatch(matchName, t.category)) payCount++; // fixed bills only in this loop — category match is safe
      }
      // Assign payments oldest-first; unpaid expired instances become carryovers.
      // Skipped (dismissed) instances are acknowledged as not-owed, so they no
      // longer consume a payment. Track which expired instances absorbed a
      // payment so the UI can explain why the current instance still shows due.
      let remaining = payCount, carried = 0, currentInstancePaid = false;
      const absorbed = [], absorbedInsts = [];
      for (const inst of instances) {
        const key = `${item.id}|${periodKey(inst.period)}`;
        const isSkipped = inst.expired && skipped.includes(key);
        const paidInst = !isSkipped && remaining > 0;
        const entry = { key, expenseId: item.id, name: item.name, amount: item.amount, fromLabel: inst.period.label };
        if (paidInst) {
          remaining--;
          if (inst.expired) { absorbed.push(inst.period.label); absorbedInsts.push(entry); }
        }
        if (inst.expired) {
          if (isSkipped) skippedEntries.push(entry);
          else if (!paidInst) { carried = Math.round((carried + item.amount) * 100) / 100; entries.push(entry); }
        }
        if (!inst.expired) currentInstancePaid = paidInst;
      }
      // Older instances that swallowed a payment while the current one is still
      // due — surfaced in the banner so the user can release the payment.
      if (dueNow && !currentInstancePaid) absorbedEntries.push(...absorbedInsts);
      byExpense[item.id] = { carried, currentInstancePaid, hasCurrentInstance: dueNow, absorbed };
    }
    return { byExpense, entries, skippedEntries, absorbedEntries };
  })();

  // Note: "already paid" is handled by the caller (expItems below) so that the
  // carryover reconciliation — not a naive same-period match — decides whether
  // a payment belongs to this period's instance or to an older unpaid one.
  function getExpenseValue(item, period) {
    if (item.type === 'debt_payoff') {
      if (item.status === 'paid_off') return 0;
      if (item.id === 'fuchase_monthly') {
        // Scheduled equal payments on real due dates through the deadline
        return fuchaseSchedule.byPeriod[periodKey(period)] || 0;
      }
      if (item.id === 'swchase_payment') {
        // Two live entries from the ledger: statement at the next due date,
        // activity + pending at the due date after that
        return swchaseForecast.byPeriod[periodKey(period)] || 0;
      }
      return expenseInPeriod(item.dueDay, period) ? item.amount : 0;
    }
    if (item.type === 'one_time') {
      // Lands only in the pay period containing the date, then never recurs
      if (!item.onDate) return 0;
      const d = new Date(item.onDate + 'T00:00:00');
      return (d >= period.start && d <= period.end) ? item.amount : 0;
    }
    if (!expenseInPeriod(item.dueDay, period)) return 0;
    return item.amount;
  }

  // Compute running balance — seeded from the live cleared checking balance
  // (same formula as the Ledger tab) so the subtotals and projections track the
  // ledger. Falls back to the manual starting balance until the checking
  // account has a balance or transactions.
  const periodData = (() => {
    const checkingAcct = (data.accounts || []).find(a => a.type === 'checking');
    let balance = cf.startingBalance;
    if (checkingAcct) {
      const txns = data.transactions.filter(t => t.account === checkingAcct.shortName);
      if (checkingAcct.currentBalance || txns.length > 0) {
        const unclearedDebits  = txns.filter(t => !t.cleared).reduce((s,t) => s + (t.debit  || 0), 0);
        const unclearedCredits = txns.filter(t => !t.cleared).reduce((s,t) => s + (t.credit || 0), 0);
        balance = (checkingAcct.currentBalance || 0) - unclearedDebits + unclearedCredits;
      }
    }
    return periods.map(p => {
      const incomeItems = cf.income.map(i => ({ ...i, value: getIncomeValue(i, p) }));
      const dedItems = cf.deductions.map(i => ({ ...i, value: i.amount }));
      const isCur = p.start <= today && today <= p.end;
      const expItems = cf.expenses.map(i => {
        const rec = isCur ? carryRecon.byExpense[i.id] : undefined;
        // Reconciled bills use oldest-first payment assignment; everything else
        // keeps the simple same-period ledger match.
        const paid = rec ? (rec.hasCurrentInstance && rec.currentInstancePaid) : expensePaidThisPeriod(i, p);
        return { ...i, value: paid ? 0 : getExpenseValue(i, p), paid, carried: rec ? rec.carried : 0,
          absorbed: rec ? rec.absorbed : [] };
      });
      const goalItems = cf.goals.map(i => ({ ...i, value: i.active ? i.perPeriodAmount : 0 }));

      const incomeTotal = incomeItems.reduce((s, i) => s + i.value, 0);
      const dedTotal = dedItems.reduce((s, i) => s + i.value, 0);
      const expTotal = expItems.reduce((s, i) => s + i.value + (i.carried || 0), 0);
      const goalTotal = goalItems.reduce((s, i) => s + i.value, 0);
      const startBal = balance;
      const net = incomeTotal - dedTotal - expTotal - goalTotal;
      balance = balance + net;
      return { period: p, incomeItems, dedItems, expItems, goalItems, incomeTotal, dedTotal, expTotal, goalTotal, startBal, endBal: balance };
    });
  })();

  const minIdx = periodData.reduce((best, d, i) => d.endBal < periodData[best].endBal ? i : best, 0);
  const minBal = periodData.length ? periodData[minIdx].endBal : 0;
  const minPeriod = periodData.length ? periodData[minIdx].period : null;
  return { periodData, minBal, minPeriod, fuchaseSchedule, swchaseForecast, carryRecon };
}

// ─── CASHFLOW SCREEN ────────────────────────────────────────────────────────
function CashflowScreen({ data, setData }) {
  const cf = data.cashflow;
  const [periodCount, setPeriodCount] = useState(() => parseInt(localStorage.getItem('pfm_period_count')) || 13);
  const periods = useMemo(() => getPeriods(periodCount), [periodCount]);

  // Live date — updates at midnight so A2 stays current without a manual refresh
  const [today, setToday] = useState(() => new Date());
  useEffect(() => {
    const now = new Date();
    const msUntilMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1) - now;
    const t = setTimeout(() => setToday(new Date()), msUntilMidnight);
    return () => clearTimeout(t);
  }, [today]);

  const { periodData, minBal, minPeriod, fuchaseSchedule, swchaseForecast, carryRecon } =
    useMemo(() => computeCashflowForecast(data, periods, today), [data, periods, today]);
  const isCurrentPeriod = (period) => period.start <= today && today <= period.end;

  // ── A1 last-updated inline edit ─────────────────────────────────────────────
  const checking = data.accounts.find(a => a.type === 'checking');

  // Cleared balance: currentBalance minus uncleared debits + uncleared credits (mirrors Ledger tab)
  const clearedBalance = useMemo(() => {
    if (!checking) return 0;
    const txns = data.transactions.filter(t => t.account === checking.shortName);
    const unclearedDebits  = txns.filter(t => !t.cleared).reduce((s,t) => s + (t.debit  || 0), 0);
    const unclearedCredits = txns.filter(t => !t.cleared).reduce((s,t) => s + (t.credit || 0), 0);
    return (checking.currentBalance || 0) - unclearedDebits + unclearedCredits;
  }, [checking, data.transactions]);
  const [editingA1, setEditingA1] = useState(false);
  const [a1Val, setA1Val] = useState('');
  function saveA1(val) {
    const updated = data.accounts.map(a => a.type === 'checking' ? { ...a, lastUpdated: val } : a);
    setData({ ...data, accounts: updated });
    setEditingA1(false);
  }

  // ── Coordinate overlay ──────────────────────────────────────────────────────
  const [showCoords, setShowCoords] = useState(() => localStorage.getItem('pfm_coords') === 'true');

  // ── Freeze panes at C3: rows 1–2 (header rows) AND columns A–B via sticky ────
  // useLayoutEffect with no dep array: re-stamps after every render so freshly-
  // mounted sub-component <td>s (BalCell/Cell/ECell) never lose the style.
  const cfTableRef = useRef(null);
  useLayoutEffect(() => {
    const table = cfTableRef.current;
    if (!table) return;

    // Blend any transparent/semi-transparent background to a fully opaque color.
    function opaqueBg(td) {
      const parse = s => {
        const m = s.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
        return m ? { r:+m[1], g:+m[2], b:+m[3], a: m[4]!==undefined ? +m[4] : 1 } : null;
      };
      const cell = parse(window.getComputedStyle(td).backgroundColor);
      if (cell && cell.a >= 1) return `rgb(${cell.r},${cell.g},${cell.b})`;
      const row = parse(window.getComputedStyle(td.parentElement).backgroundColor);
      const base = (row && row.a >= 1) ? row : { r:255, g:255, b:255 };
      if (!cell || cell.a === 0) return `rgb(${base.r},${base.g},${base.b})`;
      return `rgb(${Math.round(cell.r*cell.a+base.r*(1-cell.a))},${Math.round(cell.g*cell.a+base.g*(1-cell.a))},${Math.round(cell.b*cell.a+base.b*(1-cell.a))})`;
    }

    const allRows = [...table.querySelectorAll('thead tr, tbody tr')];
    if (!allRows.length) return;

    // Pre-compute left edge of each column from the period header row
    // (it has one direct <td> per column with no rowspan gaps).
    const hRow = table.querySelector('.row-period-header') || allRows[0];
    const hCells = [...hRow.querySelectorAll('td')];
    const hasCoord = hCells[0]?.classList.contains('coord-cell');
    const nFrozenCols = hasCoord ? 3 : 2; // coord? + A (sec-label) + B (label)
    const colLefts = [];
    let cumL = 0;
    for (const hc of hCells) { colLefts.push(cumL); cumL += hc.offsetWidth; }

    // Rowspan tracker: spanState[colIdx] = remaining rows a rowspan occupies.
    // Using pre-computed colLefts (not td.offsetLeft) avoids layout shifts from
    // sticky being applied mid-loop to earlier cells.
    const spanState = {};
    let cumHeight = 0;
    let rowsDone = false;

    for (const tr of allRows) {
      // Rows 1–2 (balance + period header) plus the coord letter row all live in <thead>
      const isFrozenRow = tr.parentElement && tr.parentElement.tagName === 'THEAD';
      const cells = [...tr.querySelectorAll('td')];
      let vCol = 0; // actual visual column index

      for (const td of cells) {
        while (vCol in spanState) vCol++; // skip columns occupied by rowspans
        const rs = td.rowSpan || 1;
        const cs = td.colSpan || 1;
        const isFrozenCol = vCol < nFrozenCols;

        if (isFrozenRow || isFrozenCol) {
          td.style.position = 'sticky';
          td.style.top    = isFrozenRow ? cumHeight + 'px' : '';
          td.style.left   = isFrozenCol ? (colLefts[vCol] ?? 0) + 'px' : '';
          td.style.zIndex = (isFrozenRow && isFrozenCol) ? '30' : isFrozenRow ? '20' : '10';
          td.style.background = opaqueBg(td);
        } else {
          // Clear any stale styles from prior renders
          td.style.position = '';
          td.style.top = '';
          td.style.left = '';
          td.style.zIndex = '';
          td.style.background = '';
        }

        if (rs > 1) for (let c = vCol; c < vCol + cs; c++) spanState[c] = rs;
        vCol += cs;
      }

      // Decrement all active rowspan counters at end of each row
      for (const col in spanState) {
        if (--spanState[col] <= 0) delete spanState[col];
      }

      cumHeight += tr.offsetHeight;
    }
  });


  // Pre-compute row numbers for every row in the table
  const rowNums = useMemo(() => {
    const nums = {};
    let r = 1;
    nums['hdr-balance']  = r++;
    nums['hdr-period']   = r++;
    nums['bal-mid']      = r++;
    nums['sec-income']   = r++;
    cf.income.forEach(item    => { nums[`inc-${item.id}`]  = r++; });
    cf.deductions.forEach(item => { nums[`ded-${item.id}`]  = r++; });
    nums['sub-income']   = r++;
    nums['sec-expenses'] = r++;
    cf.expenses.forEach(item  => { nums[`exp-${item.id}`]  = r++; });
    cf.goals.forEach(item     => { nums[`goal-${item.id}`] = r++; });
    nums['sub-expenses'] = r++;
    nums['bal-bottom']   = r++;
    return nums;
  }, [cf]);

  // Column letters: A=section label, B=row label, C=amount, D=due day, E+ = periods
  const colLetters = useMemo(() => {
    const base = ['B','C','D']; // row label, amount, due day
    periods.forEach((_, i) => {
      const n = i + 4; // A=section(separate), B=label, C=amount, D=due, E=period0...
      if (n < 26) base.push(String.fromCharCode(65 + n));
      else base.push('A' + String.fromCharCode(65 + (n - 26)));
    });
    return base;
  }, [periods]);

  const cx = showCoords; // shorthand
  const RC = ({ k }) => cx ? <td className="coord-cell">{rowNums[k]}</td> : null;
  const extraSpan = cx ? 1 : 0;

  // ── Inline editing ──────────────────────────────────────────────────────────
  const [editCell, setEditCell] = useState(null); // { section, id, field }
  const [editVal, setEditVal] = useState('');
  const cfUndoStack = useRef([]);

  // Ctrl+Z / Cmd+Z undo
  useEffect(() => {
    function onKeyDown(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
        if (cfUndoStack.current.length > 0) {
          e.preventDefault();
          setData(cfUndoStack.current.pop());
        }
      }
    }
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, []);

  // ── Income settings modal ───────────────────────────────────────────────────
  const [incomeEditItem, setIncomeEditItem] = useState(null);
  const [incomeForm, setIncomeForm] = useState({});
  const [addingIncome, setAddingIncome] = useState(false);

  function openIncomeModal(item) {
    setIncomeEditItem(item);
    setAddingIncome(false);
    setIncomeForm({ name: item.name, amount: item.amount ?? 0, frequency: item.frequency || 'every_period', dueDay: item.dueDay ?? '',
      onDate: item.onDate ?? '', intervalWeeks: item.intervalWeeks ?? 2, anchorDate: item.anchorDate ?? '', expectedDate: item.expectedDate ?? '',
      startDate: item.startDate ?? '', endDate: item.endDate ?? '' });
  }

  function addIncomeRow() {
    const newItem = { id: `income_${Date.now()}`, name: 'New income', amount: 0, frequency: 'every_period' };
    setIncomeEditItem(newItem);
    setAddingIncome(true);
    setIncomeForm({ name: 'New income', amount: 0, frequency: 'every_period', dueDay: '', onDate: '', intervalWeeks: 2, anchorDate: '', expectedDate: '', startDate: '', endDate: '' });
  }

  function saveIncomeModal() {
    cfUndoStack.current.push(data);
    if (cfUndoStack.current.length > 30) cfUndoStack.current.shift();
    const f = incomeForm.frequency;
    const patch = { name: incomeForm.name, amount: parseFloat(incomeForm.amount) || 0,
      frequency: f,
      dueDay: f === 'monthly' ? (parseInt(incomeForm.dueDay) || null) : undefined,
      onDate: f === 'one_time' ? (incomeForm.onDate || null) : undefined,
      intervalWeeks: f === 'every_n_weeks' ? (Math.max(1, parseInt(incomeForm.intervalWeeks) || 2)) : undefined,
      anchorDate: f === 'every_n_weeks' ? (incomeForm.anchorDate || null) : undefined,
      expectedDate: (f === 'every_period' || f === 'custom') ? (incomeForm.expectedDate || null) : undefined,
      startDate: f !== 'one_time' ? (incomeForm.startDate || null) : undefined,
      endDate: f !== 'one_time' ? (incomeForm.endDate || null) : undefined };
    const newList = addingIncome
      ? [...data.cashflow.income, { ...incomeEditItem, ...patch }]
      : data.cashflow.income.map(i => i.id === incomeEditItem.id ? { ...i, ...patch } : i);
    setData({ ...data, cashflow: { ...data.cashflow, income: newList } });
    setIncomeEditItem(null);
    setAddingIncome(false);
  }

  function deleteIncomeItem(id) {
    cfUndoStack.current.push(data);
    if (cfUndoStack.current.length > 30) cfUndoStack.current.shift();
    setData({ ...data, cashflow: { ...data.cashflow, income: data.cashflow.income.filter(i => i.id !== id) } });
    setIncomeEditItem(null);
  }

  // ── Expense settings modal ──────────────────────────────────────────────────
  const [expenseEditItem, setExpenseEditItem] = useState(null);
  const [expenseForm, setExpenseForm] = useState({});
  const [addingExpense, setAddingExpense] = useState(false);

  function openExpenseModal(item) {
    setExpenseEditItem(item);
    setAddingExpense(false);
    setExpenseForm({ name: item.name, amount: item.amount ?? 0, type: item.type || 'fixed', dueDay: item.dueDay ?? '', onDate: item.onDate ?? '' });
  }

  function addExpenseRow() {
    const newItem = { id: `expense_${Date.now()}`, name: 'New expense', amount: 0, dueDay: null, type: 'fixed', status: 'active' };
    setExpenseEditItem(newItem);
    setAddingExpense(true);
    setExpenseForm({ name: 'New expense', amount: 0, type: 'fixed', dueDay: '', onDate: '' });
  }

  function saveExpenseModal() {
    cfUndoStack.current.push(data);
    if (cfUndoStack.current.length > 30) cfUndoStack.current.shift();
    const hasDueDay = expenseForm.type === 'fixed' || expenseForm.type === 'debt_payoff';
    const patch = { name: expenseForm.name, amount: parseFloat(expenseForm.amount) || 0,
      type: expenseForm.type, dueDay: hasDueDay ? (parseInt(expenseForm.dueDay) || null) : null,
      onDate: expenseForm.type === 'one_time' ? (expenseForm.onDate || null) : undefined };
    const newList = addingExpense
      ? [...data.cashflow.expenses, { ...expenseEditItem, ...patch }]
      : data.cashflow.expenses.map(e => e.id === expenseEditItem.id ? { ...e, ...patch } : e);
    setData({ ...data, cashflow: { ...data.cashflow, expenses: newList } });
    setExpenseEditItem(null);
    setAddingExpense(false);
  }

  function deleteExpenseItem(id) {
    cfUndoStack.current.push(data);
    if (cfUndoStack.current.length > 30) cfUndoStack.current.shift();
    setData({ ...data, cashflow: { ...data.cashflow, expenses: data.cashflow.expenses.filter(e => e.id !== id) } });
    setExpenseEditItem(null);
  }

  // ── Section sort (income / expenses) ────────────────────────────────────────
  // Cycles due day → amount → name. Rows with a due day always stay grouped
  // above variable rows (no due day); each group is sorted independently.
  // Reorders the saved lists, so Ctrl+Z undoes a sort.
  const SORT_MODES = ['dueDay', 'amount', 'name'];
  const SORT_MODE_LABELS = { dueDay: 'due day', amount: 'amount (high→low)', name: 'name (A–Z)' };
  const [sortModeIdx, setSortModeIdx] = useState({ income: -1, expenses: -1 });
  const nextSortMode = (section) => SORT_MODES[(sortModeIdx[section] + 1) % SORT_MODES.length];

  function sortSection(section) {
    const mode = nextSortMode(section);
    cfUndoStack.current.push(data);
    if (cfUndoStack.current.length > 30) cfUndoStack.current.shift();
    const byName = (a, b) => (a.name || '').localeCompare(b.name || '');
    const cmp = mode === 'amount' ? (a, b) => ((b.amount || 0) - (a.amount || 0)) || byName(a, b)
              : mode === 'dueDay' ? (a, b) => ((a.dueDay || 99) - (b.dueDay || 99)) || byName(a, b)
              : byName;
    const sortList = (list) => {
      const withDue = list.filter(i => i.dueDay != null);
      const noDue   = list.filter(i => i.dueDay == null);
      // In due-day mode the no-due-day (variable) group falls back to name order
      const cmpNoDue = mode === 'dueDay' ? byName : cmp;
      return [...[...withDue].sort(cmp), ...[...noDue].sort(cmpNoDue)];
    };
    const cfNew = { ...data.cashflow };
    if (section === 'income') cfNew.income = sortList(data.cashflow.income);
    else cfNew.expenses = sortList(data.cashflow.expenses);
    setData({ ...data, cashflow: cfNew });
    setSortModeIdx(s => ({ ...s, [section]: (s[section] + 1) % SORT_MODES.length }));
  }

  // ── Carryover skip / restore ────────────────────────────────────────────────
  // "Skip" records a deliberate exception (bill genuinely not owed) so the
  // carryover stops forecasting it. Stored per-instance in cf.skippedCarryovers;
  // stale keys outside the lookback window are pruned on each write.
  function skipCarryover(key) {
    cfUndoStack.current.push(data);
    if (cfUndoStack.current.length > 30) cfUndoStack.current.shift();
    const valid = new Set([...carryRecon.entries, ...carryRecon.skippedEntries, ...carryRecon.absorbedEntries].map(e => e.key));
    const pruned = (data.cashflow.skippedCarryovers || []).filter(k => valid.has(k));
    setData({ ...data, cashflow: { ...data.cashflow, skippedCarryovers: [...pruned, key] } });
  }

  function restoreSkippedCarryovers() {
    cfUndoStack.current.push(data);
    if (cfUndoStack.current.length > 30) cfUndoStack.current.shift();
    const skippedKeys = new Set(carryRecon.skippedEntries.map(e => e.key));
    setData({ ...data, cashflow: { ...data.cashflow, skippedCarryovers: (data.cashflow.skippedCarryovers || []).filter(k => !skippedKeys.has(k)) } });
  }

  // "Dismiss" is display-only: it hides a carryover chip from the banner
  // without touching the oldest-first payment reconciliation. This is the
  // safe option for an *absorbed* entry -- clicking "release" there re-assigns
  // that instance's payment forward to the current period's own due instance,
  // which is only correct when the old bill genuinely wasn't owed. When it
  // was actually paid (just posted a few days into the next period, so it
  // perpetually shows as "absorbed"), release would incorrectly zero out the
  // current period's forecast. Dismiss just acknowledges the notice.
  function dismissCarryover(key) {
    cfUndoStack.current.push(data);
    if (cfUndoStack.current.length > 30) cfUndoStack.current.shift();
    const valid = new Set([...carryRecon.entries, ...carryRecon.skippedEntries, ...carryRecon.absorbedEntries].map(e => e.key));
    const pruned = (data.cashflow.dismissedCarryovers || []).filter(k => valid.has(k));
    setData({ ...data, cashflow: { ...data.cashflow, dismissedCarryovers: [...pruned, key] } });
  }

  function restoreDismissedCarryovers() {
    cfUndoStack.current.push(data);
    if (cfUndoStack.current.length > 30) cfUndoStack.current.shift();
    const visibleKeys = new Set([...carryRecon.entries, ...carryRecon.absorbedEntries].map(e => e.key));
    setData({ ...data, cashflow: { ...data.cashflow, dismissedCarryovers: (data.cashflow.dismissedCarryovers || []).filter(k => !visibleKeys.has(k)) } });
  }

  function startCfEdit(section, id, field, val) {
    setEditCell({ section, id, field });
    setEditVal(val === null || val === undefined ? '' : String(val));
  }

  function saveCfEdit() {
    if (!editCell) return;
    // Snapshot current data before overwriting so Ctrl+Z can restore it
    cfUndoStack.current.push(data);
    if (cfUndoStack.current.length > 30) cfUndoStack.current.shift();
    const { section, id, field } = editCell;
    const cf = { ...data.cashflow };
    if (section === 'startBal') {
      cf.startingBalance = parseFloat(editVal) || 0;
    } else if (section === 'income') {
      cf.income = cf.income.map(i => i.id === id ? { ...i, [field]: parseFloat(editVal) || 0 } : i);
    } else if (section === 'customIncome') {
      cf.income = cf.income.map(i => i.id === id ? { ...i, customAmounts: { ...(i.customAmounts || {}), [field]: parseFloat(editVal) || 0 } } : i);
    } else if (section === 'incomeOverride') {
      // Blank input clears the override for that period, reverting to the normal formula amount
      cf.income = cf.income.map(i => {
        if (i.id !== id) return i;
        const overrides = { ...(i.periodOverrides || {}) };
        if (editVal.trim() === '') delete overrides[field];
        else overrides[field] = parseFloat(editVal) || 0;
        return { ...i, periodOverrides: overrides };
      });
    } else if (section === 'deduction') {
      cf.deductions = cf.deductions.map(d => d.id === id ? { ...d, [field]: parseFloat(editVal) || 0 } : d);
    } else if (section === 'expense') {
      const v = field === 'dueDay' ? (parseInt(editVal) || null) : (parseFloat(editVal) || 0);
      cf.expenses = cf.expenses.map(e => e.id === id ? { ...e, [field]: v } : e);
    } else if (section === 'goal') {
      cf.goals = cf.goals.map(g => g.id === id ? { ...g, [field]: parseFloat(editVal) || 0 } : g);
    }
    setData({ ...data, cashflow: cf });
    setEditCell(null);
  }

  function cancelCfEdit() { setEditCell(null); }

  function ECell({ section, id, field, value, display, className, title }) {
    const active = editCell?.section === section && editCell?.id === id && editCell?.field === field;
    if (active) {
      return (
        <td className={className}>
          <input
            className="cf-edit-input"
            type="number"
            value={editVal}
            onChange={e => setEditVal(e.target.value)}
            onBlur={saveCfEdit}
            onKeyDown={e => { if (e.key === 'Enter') saveCfEdit(); if (e.key === 'Escape') cancelCfEdit(); }}
            autoFocus
          />
        </td>
      );
    }
    return (
      <td className={[className, 'cf-editable'].filter(Boolean).join(' ')} title={title}
          onClick={() => startCfEdit(section, id, field, value)}>
        {display}
      </td>
    );
  }
  // ────────────────────────────────────────────────────────────────────────────

  function Cell({ value, isCurrent }) {
    const cls = ['num', isCurrent ? 'col-current' : ''].filter(Boolean).join(' ');
    if (value === 0) return <td className={cls + ' zero'}></td>;
    return <td className={cls}>{FMT_USD(value)}</td>;
  }

  function BalCell({ value, isCurrent, id, isMin }) {
    const cls = ['num', isCurrent ? 'col-current' : '', value < 0 ? 'neg-bal' : '', isMin ? 'min-bal-cell' : ''].filter(Boolean).join(' ');
    return <td id={id} className={cls}>{FMT_USD_SIGNED(value)}</td>;
  }

  const rowStyle = (item) => {
    if (item.style === 'highlight_yellow') return 'row-highlight-yellow';
    if (item.style === 'highlight_blue') return 'row-highlight-blue';
    if (item.style === 'highlight_pink') return 'row-highlight-pink';
    if (item.style === 'income') return 'row-paycheck';
    if (item.style === 'income_tracked') return 'row-income-tracked';
    if (item.style === 'deduction') return 'row-deduction';
    if (item.type === 'debt_payoff' && item.status === 'payoff_in_progress') return 'row-highlight-yellow';
    if (item.type === 'debt_payoff' && item.id === 'fuchase_monthly') return 'row-highlight-blue';
    return 'row-expense';
  };

  return (
    <div className="screen">
      <div style={{marginBottom:8, display:'flex', gap:8, alignItems:'center'}}>
        <button className={`coord-btn${cx ? ' active' : ''}`} title="Toggle row/column reference labels" onClick={() => setShowCoords(v => { const n = !v; localStorage.setItem('pfm_coords', n); return n; })}>
          {cx ? '⊞ Grid Ref ON' : '⊞ Grid Ref'}
        </button>
        <select className="period-select" value={periodCount} onChange={e => { const n = +e.target.value; setPeriodCount(n); localStorage.setItem('pfm_period_count', n); }}>
          {[6, 13, 26, 52].map(n => <option key={n} value={n}>{n} periods</option>)}
        </select>
      </div>
      {(() => {
        const dismissedSet = new Set(cf.dismissedCarryovers || []);
        const visibleEntries = carryRecon.entries.filter(e => !dismissedSet.has(e.key));
        const visibleAbsorbed = carryRecon.absorbedEntries.filter(e => !dismissedSet.has(e.key));
        const dismissedCount = [...carryRecon.entries, ...carryRecon.absorbedEntries].filter(e => dismissedSet.has(e.key)).length;
        return (<>
      {(visibleEntries.length > 0 || visibleAbsorbed.length > 0) && (
        <div className="carryover-banner">
          <strong>⚠ Carried over from a previous pay period:</strong>
          {visibleEntries.map(e => (
            <span key={e.key} className="carryover-chip">
              {e.name} {FMT_USD(e.amount)} <em>from {e.fromLabel}</em>
              <button onClick={() => skipCarryover(e.key)} title="Not owed — remove this one from the forecast">skip</button>
            </span>
          ))}
          {visibleAbsorbed.map(e => (
            <span key={e.key} className="carryover-chip" title={`This older unpaid "${e.name}" bill absorbed your recent payment (payments settle oldest-first), so the current period still shows it as due. If this old bill was never really owed, release the payment to the current period. If it WAS owed and paid (just posted a little late), dismiss instead — that hides this notice without touching the current period's forecast.`}>
              {e.name} {FMT_USD(e.amount)} <em>from {e.fromLabel} — absorbed this period's payment</em>
              <button onClick={() => skipCarryover(e.key)} title="Old bill not owed — release the payment to the current period (may zero out this period's forecast for this bill)">release</button>
              <button onClick={() => dismissCarryover(e.key)} title="Old bill was paid — just hide this notice, current period is unaffected">dismiss</button>
            </span>
          ))}
          <span className="carryover-hint">Log the payment in the Ledger and it clears automatically.</span>
          {carryRecon.skippedEntries.length > 0 && (
            <button className="carryover-restore" onClick={restoreSkippedCarryovers}>restore {carryRecon.skippedEntries.length} skipped</button>
          )}
          {dismissedCount > 0 && (
            <button className="carryover-restore" onClick={restoreDismissedCarryovers}>restore {dismissedCount} dismissed</button>
          )}
        </div>
      )}

// ─── DASHBOARD SCREEN ───────────────────────────────────────────────────────
// ─── NET WORTH TREND ────────────────────────────────────────────────────────
// Per-pay-period net worth history as a simple SVG line chart. Shows up once
// at least one snapshot exists; each dot's tooltip breaks the number down.
function NetWorthTrend({ history }) {
  const hist = [...(history || [])].sort((a, b) => a.period.localeCompare(b.period)).slice(-26);
  if (hist.length === 0) return null;
  const w = 640, h = 150, padL = 10, padR = 10, padT = 16, padB = 8;
  const vals = hist.map(s => s.netWorth);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const x = i => hist.length === 1 ? w / 2 : padL + i * (w - padL - padR) / (hist.length - 1);
  const y = v => padT + (h - padT - padB) * (1 - (v - min) / range);
  const pts = hist.map((s, i) => `${x(i).toFixed(1)},${y(s.netWorth).toFixed(1)}`).join(' ');
  const last = hist[hist.length - 1], prev = hist.length > 1 ? hist[hist.length - 2] : null;
  const delta = prev ? Math.round((last.netWorth - prev.netWorth) * 100) / 100 : null;
  const sgn = v => (v < 0 ? '-' : '') + FMT_USD(v);
  return (
    <div className="card" style={{marginBottom: 16}}>
      <div className="card-title">Net Worth Over Time</div>
      <div style={{display:'flex', alignItems:'baseline', gap:10, flexWrap:'wrap'}}>
        <div className={`card-value ${last.netWorth >= 0 ? '' : 'negative'}`}>{sgn(last.netWorth)}</div>
        {delta !== null && (
          <span style={{fontSize:12, fontWeight:700, color: delta >= 0 ? '#1a7a1a' : '#cc2200'}}>
            {delta >= 0 ? '▲' : '▼'} {FMT_USD(Math.abs(delta))} vs last period
          </span>
        )}
        <span className="card-sub" style={{marginLeft:'auto'}}>{hist.length} period{hist.length > 1 ? 's' : ''} tracked</span>
      </div>
      {hist.length > 1 && (
        <svg viewBox={`0 0 ${w} ${h}`} style={{width:'100%', height:'auto', marginTop:6}} preserveAspectRatio="none">
          <polyline points={`${pts} ${x(hist.length-1).toFixed(1)},${h} ${x(0).toFixed(1)},${h}`} fill="rgba(26,92,168,0.08)" stroke="none" />
          <polyline points={pts} fill="none" stroke="#1a5ca8" strokeWidth="2" />
          {hist.map((s, i) => (
            <circle key={s.period} cx={x(i)} cy={y(s.netWorth)} r="3.5" fill={i === hist.length-1 ? '#1a3a5c' : '#1a5ca8'}>
              <title>{`${displayDate(s.period)} — net worth ${sgn(s.netWorth)}\nchecking ${sgn(s.checking)} · assets ${sgn(s.assets)} · liabilities ${sgn(s.liabilities)} · credit cards ${sgn(s.ccTotal)}`}</title>
            </circle>
          ))}
        </svg>
      )}
      <div style={{display:'flex', justifyContent:'space-between', fontSize:10, color:'#999', marginTop:2}}>
        <span>{displayDate(hist[0].period)}</span>
        {hist.length > 1 && <span>{displayDate(last.period)}</span>}
      </div>
    </div>
  );
}

function DashboardScreen({ data }) {
  const cf = data.cashflow;
  const periods = useMemo(() => getPeriods(13), []);
  const today = new Date();
  const currentPeriod = periods[0];
  const accounts = data.accounts;

  const checking = accounts.find(a => a.type === 'checking');
  const creditCards = accounts.filter(a => a.type === 'credit');
  const totalCC = creditCards.reduce((s, a) => s + (a.statementBalance + a.activityBalance + a.pendingBalance), 0);

  // Current period income/expenses
  const income = cf.income.reduce((s, item) => {
    if (item.frequency === 'every_period') return s + item.amount;
    const key = periodKey(currentPeriod);
    return s + (item.customAmounts?.[key] || 0);
  }, 0);
  const expenses = cf.expenses.reduce((s, item) => {
    return s + (expenseInPeriod(item.dueDay, currentPeriod) ? (item.type === 'debt_payoff' ? (item.paymentAmount || item.remainingBalance) : item.amount) : 0);
  }, 0);
  const varExpenses = cf.expenses.filter(e => e.type === 'variable').reduce((s, e) => s + e.amount, 0);
  const net = income - expenses - varExpenses;

  // Fuchase deadline
  const fuchase = cf.expenses.find(e => e.id === 'fuchase_monthly');
  const deadline = fuchase?.deadline ? new Date(fuchase.deadline) : null;
  const daysToDeadline = deadline ? Math.ceil((deadline - today) / (1000*60*60*24)) : null;
  const paymentsLeft = fuchase ? Math.ceil(fuchase.remainingBalance / fuchase.paymentAmount) : 0;

  // Upcoming bills this period
  const upcomingBills = cf.expenses.filter(e =>
    e.type === 'fixed' && e.amount > 0 && expenseInPeriod(e.dueDay, currentPeriod)
  );

  return (
    <div className="screen">
      <div className="dash-grid">
        <div className="card">
          <div className="card-title">Checking Balance</div>
          <div className="card-value">{FMT_USD(checking?.currentBalance)}</div>
          <div className="card-sub">Cleared: {FMT_USD(checking?.clearedBalance)}</div>
        </div>
        <div className="card">
          <div className="card-title">This Period Net</div>
          <div className={`card-value ${net >= 0 ? 'positive' : 'negative'}`}>{net >= 0 ? '+' : ''}{FMT_USD(net)}</div>
          <div className="card-sub">Income {FMT_USD(income)} · Expenses ~{FMT_USD(expenses + varExpenses)}</div>
        </div>
        <div className="card">
          <div className="card-title">Total CC Balance</div>
          <div className={`card-value ${totalCC > 0 ? 'warning' : 'positive'}`}>{FMT_USD(totalCC)}</div>
          <div className="card-sub">{creditCards.filter(c => c.statementBalance + c.activityBalance + c.pendingBalance > 0).length} card(s) with balance</div>
        </div>
        <div className="card">
          <div className="card-title">FuChase Payoff Progress</div>
          <div className="card-value warning">{FMT_USD(fuchase?.remainingBalance)}</div>
          <div className="progress-bar">
            <div className="progress-fill warning" style={{width: `${Math.max(0, 100 - (fuchase?.remainingBalance / 7217.28 * 100))}%`}} />
          </div>
          <div className="card-sub">{paymentsLeft} payments left · deadline {fuchase?.deadline}</div>
        </div>
      </div>

      {/* Alerts */}
      {daysToDeadline !== null && daysToDeadline < 120 && (
        <div className={`alert-box ${daysToDeadline < 60 ? 'urgent' : ''}`}>
          <div className="alert-title">⚠ 0% APR Deadline — FuChase</div>
          <div className="alert-sub">{daysToDeadline} days until {fuchase.deadline}. {paymentsLeft} payments of {FMT_USD(fuchase.paymentAmount)} remaining. Balance: {FMT_USD(fuchase.remainingBalance)}.</div>
        </div>
      )}

      <NetWorthTrend history={data.netWorthHistory} />

      <div className="section-title">Current Period · {currentPeriod.label} – {
        new Date(currentPeriod.end).toLocaleDateString('en-US', {month:'numeric', day:'numeric', year:'2-digit'})
      }</div>

      <div className="bills-list">
        {upcomingBills.map(bill => (
          <div key={bill.id} className="bill-row">
            <span className="bill-name">{bill.name}</span>
            <span className="bill-due">due {bill.dueDay}th</span>
            <span className="bill-amount">{FMT_USD(bill.amount)}</span>
          </div>
        ))}
        {upcomingBills.length === 0 && <div className="bill-row" style={{color:'#aaa'}}>No fixed bills this period</div>}
      </div>
    </div>
  );
}

// Cleared-status display (shared between TransactionTable and the Ledger
// screen's "last cleared" summary chip).
const CLEARED_OPTIONS = ['', 'yes', 'cc activity', 'cc pending', 'cc statement'];
const CLEARED_LABEL = { yes:'Cleared', 'cc activity':'CC Activity', 'cc pending':'CC Pending', 'cc statement':'CC Statement', '':'—' };
const CLEARED_CLASS = { yes:'cleared-yes', 'cc activity':'cleared-cc', 'cc pending':'cleared-pending', 'cc statement':'cleared-statement', '':'cleared-blank' };

// ─── SHARED TRANSACTION TABLE ───────────────────────────────────────────────
function TransactionTable({ transactions, onUpdate, onDelete, maxRows, sortCol, sortDir, onSort, accounts = [], totals, filters, onFilterChange, highlightId }) {
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({});

  useEffect(() => {
    if (!editingId) return;
    const handler = e => { if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); } };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [editingId]);
