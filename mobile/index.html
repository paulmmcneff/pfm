          const count = importCSV(text, data, setData);
          alert(`Imported ${count} transactions.`);
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  async function handleExport() {
    if (fileHandle) {
      const ok = await writeFile(fileHandle, data);
      if (ok) { alert('Saved to data.json ✓'); return; }
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'data.json'; a.click();
    URL.revokeObjectURL(url);
  }

  const tabs = [
    { id:'cashflow', label:'Cashflow' },
    { id:'transactions', label:'Transactions' },
    { id:'ledger', label:'Ledger' },
    { id:'dashboard', label:'Dashboard' },
  ];

  // Inline icons for the mobile bottom tab bar
  const TAB_ICONS = {
    cashflow: <svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7" /><polyline points="15 7 21 7 21 13" /></svg>,
    ledger: <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6" /><line x1="8" y1="12" x2="21" y2="12" /><line x1="8" y1="18" x2="21" y2="18" /><line x1="3" y1="6" x2="3.01" y2="6" /><line x1="3" y1="12" x2="3.01" y2="12" /><line x1="3" y1="18" x2="3.01" y2="18" /></svg>,
    transactions: <svg viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z" /><line x1="9" y1="8" x2="15" y2="8" /><line x1="9" y1="12" x2="15" y2="12" /></svg>,
    dashboard: <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /></svg>,
  };
  const [showMenu, setShowMenu] = useState(false);

  return (
    <div>
      <nav className="nav">
        <span className="nav-title">
          <span className="title-full">Personal Finance Manager</span>
          <span className="title-short">PFM Mobile</span>
          {' '}<span style={{fontSize:10, opacity:0.6, fontWeight:400}}>{APP_VERSION}</span>
        </span>
        <div className="nav-tabs">
          {tabs.map(t => (
            <button key={t.id} className={`nav-tab ${tab===t.id?'active':''}`} onClick={()=>switchTab(t.id)}>{t.label}</button>
          ))}
        </div>
        <button className="nav-menu-btn" title="More options" onClick={()=>setShowMenu(v=>!v)}>⋯</button>
        <div className="nav-right">
          {fileStatus === 'connected'
            ? <span style={{color:'#7fc97f', fontSize:12, display:'flex', alignItems:'center', gap:4}}>
                <span style={{fontSize:9}}>●</span> data.json linked
              </span>
            : fileStatus === 'readonly'
              ? <span style={{color:'#f0c040', fontSize:12, display:'flex', alignItems:'center', gap:4}}>
                  <span style={{fontSize:9}}>●</span> read-only (export to save)
                </span>
            : fileStatus === 'none'
              ? <button className="nav-btn" onClick={handleLinkFile} title="Link data.json so the app auto-saves your transactions">⛓ Link data.json</button>
              : null
          }
          <button className="nav-btn" title="Import transactions from a CSV file, or restore from a JSON backup" onClick={handleImport}>⬆ Import</button>
          <button className="nav-btn" title={fileHandle ? 'Save all data to linked data.json file' : 'Export all data as a JSON file'} onClick={handleExport}>⬇ {fileHandle ? 'Save' : 'Export'}</button>
        </div>
      </nav>
      {showMenu && (
        <div className="mobile-menu-overlay" onClick={()=>setShowMenu(false)}>
          <div className="mobile-menu" onClick={e=>e.stopPropagation()}>
            <div className="menu-status">
              {fileStatus === 'connected' ? '● data.json linked'
               : fileStatus === 'readonly' ? '● read-only (export to save)'
               : `${data.transactions.length.toLocaleString()} transactions on this device`}
            </div>
            {fileStatus === 'none' && FSA_SUPPORTED && (
              <button onClick={()=>{ setShowMenu(false); handleLinkFile(); }}>⛓ Link data.json</button>
            )}
            <button onClick={()=>{ setShowMenu(false); handleImport(); }}>⬆ Import data (JSON / CSV)</button>
            <button onClick={()=>{ setShowMenu(false); handleExport(); }}>⬇ {fileHandle ? 'Save to data.json' : 'Export data (JSON)'}</button>
          </div>
        </div>
      )}
      {tab === 'cashflow'  && <CashflowScreen data={data} setData={setData} />}
      {tab === 'dashboard' && <DashboardScreen data={data} />}
      {tab === 'transactions' && <TransactionsScreen data={data} setData={setData} />}
      {tab === 'ledger'    && <LedgerScreen data={data} setData={setData} onOpenTxns={openTxns} />}
      <nav className="tabbar">
        {tabs.map(t => (
          <button key={t.id} className={`tabbar-btn ${tab===t.id?'active':''}`} onClick={()=>switchTab(t.id)}>
            {TAB_ICONS[t.id]}
            <span>{t.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
// PWA service worker — only when served over http(s), never for local file:// use
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
